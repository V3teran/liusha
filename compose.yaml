# liusha 基座 compose：服务拓扑（生产形态叠加 compose.prod.yaml；本地开发见 scripts/dev/up.sh）。
#
# ── 三种部署形态（详见 deployments/README.md）─────────────────────────────
#  A 本地开发：docker compose up -d（基座默认只起 pg+redis，业务服务挂 full profile 不起）
#    + ./scripts/dev/run-svc.sh 业务进程 host 二进制；
#    runner 经宿主 docker 拉起第三个容器（沙盒 sandbox，warm pool 自动管理）。
#  B 生产全容器：make prod-up（= compose.yaml + compose.prod.yaml 叠加 --profile full 全起）。
#    migrate/api/nginx/proxy/runner/sandbox 挂 full profile（dev 不起；sandbox scale 0 只拉不起）；
#    postgres/redis 常驻无门控。
#  C 单镜像：make single-build（deployments/single/，比赛/受限环境用）。
#
# nginx 前置：/ → 前端 SPA，/api/* → api:8580（前端源码在仓库根 web/，同仓 monorepo）。
# proxy（cmd/proxy）：内嵌 proxify SDK 的 MITM + filter/dedup/aggregator + Asynq 生产者，监听 8588。
# runner（cmd/runner）：Asynq 消费者 + ReAct 引擎，监听 8590（healthz + 流量 ingest）。
# 业界最佳实践：proxy 与 worker 独立进程，故障隔离 + 独立扩缩。

# ── 镜像版本 ─────────────────────────────────────────────────────────────
# 镜像 tag 缺省 = 本份代码对应的发布版本（行尾带 release-please 版本标记的行由
# release-please 发版时自动改写），检出哪个 tag 就部署哪个版本，compose/config 与镜像
# 永远同版本。.env 设 LIUSHA_IMAGE_TAG 可覆盖（如 latest 跟随最新正式版）。

# ── 共享定义（x- 扩展字段 + YAML 锚点）：app 服务公共 env / 依赖 / profile 只写一次 ──
x-app-env: &app-env
  # 密钥一律显式注入（仓库根 .env），基座不兜底任何环境默认值
  # DSN 密码与 POSTGRES_PASSWORD 同源——改库密码不再需要手改两处
  LIUSHA_POSTGRES_DSN: postgres://liusha:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置}@postgres:5432/liusha?sslmode=disable
  LIUSHA_REDIS_ADDR: redis:6379
  # 与 redis 服务的 REDIS_PASSWORD 配对（必填）
  LIUSHA_REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD 未设置}"
  LIUSHA_CONFIG: /app/config/config.yaml
  # 环境默认 = dev 值；生产 overlay（compose.prod.yaml）按键覆盖为 production/json
  LIUSHA_ENV: development
  LIUSHA_LOG_LEVEL: info

x-app-deps: &app-deps
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  # 迁移先行：migrate 一次性服务成功退出后业务才起（幂等，重复 up 为 no-op）
  migrate:
    condition: service_completed_successfully

x-full-profile: &full-profile
  - full

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: liusha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: liusha
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置}"
      POSTGRES_DB: liusha
    # 仅绑回环：库不对外；host 开发进程（run-svc.sh）连 localhost 照常可达
    ports:
      # 宿主端口一律「5+容器端口」前缀（不足五位补 0）
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      # 持久化统一 ~/data/liusha 前缀（HOST_DATA_DIR 可覆盖；macOS 上 pg 走
      # virtiofs 有 IO 折损，介意者改回 named volume）
      - ${HOST_DATA_DIR:-$HOME/data/liusha}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liusha -d liusha"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8
    container_name: liusha-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD 未设置}"
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    # 仅绑回环：队列/缓存不对外
    # 仅绑回环（有强制密码）
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-56379}:6379"
    volumes:
      - ${HOST_DATA_DIR:-$HOME/data/liusha}/redis:/data
    healthcheck:
      # requirepass 下裸 ping 返回 NOAUTH，必须带 -a
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  # 一次性数据库迁移：与 api 同镜像（内含 migrations + migrate CLI），
  # entrypoint 覆盖为 migrate up；开发形态（make migrate 手动）不起本服务。
  migrate:
    image: ${LIUSHA_IMAGE_REPO:-ghcr.io/v3teran}/liusha-api:${LIUSHA_IMAGE_TAG:-0.5.1} # x-release-please-version
    build:
      context: .
      dockerfile: cmd/api/Dockerfile
    profiles: *full-profile
    restart: "no"
    entrypoint: ["/app/migrate", "-path", "/app/migrations", "-database", "postgres://liusha:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置}@postgres:5432/liusha?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${LIUSHA_IMAGE_REPO:-ghcr.io/v3teran}/liusha-api:${LIUSHA_IMAGE_TAG:-0.5.1} # x-release-please-version
    build:
      context: .
      dockerfile: cmd/api/Dockerfile
    container_name: liusha-api
    restart: unless-stopped
    # LLM key 名由 config.yaml 各 provider 的 api_key_env 决定（GLM_API_KEY /
    # DEEPSEEK_API_KEY / ...），无法枚举——.env 整文件透传；environment 块
    # 优先级更高，显式定义不受影响。
    env_file:
      - .env
    environment:
      <<: *app-env
      LIUSHA_API_ADDR: 0.0.0.0:8580  # 与本地 dev（run-svc.sh）同端口；避开 8080/8580 等常用段
      # 初始管理员密码：仅账号表为空的首次启动生效（建 admin 账号），之后改密走前端、
      # 本变量被忽略。不存在"服务已起、账号未建"的公网抢占窗口（api 无建号端点）。
      LIUSHA_ADMIN_INITIAL_PASSWORD: "${LIUSHA_ADMIN_INITIAL_PASSWORD:?LIUSHA_ADMIN_INITIAL_PASSWORD 未设置}"
      # LLM provider 密钥加密密钥：用于加密存储在数据库中的 API keys
      LIUSHA_LLM_KEY_SECRET: "${LIUSHA_LLM_KEY_SECRET:?LIUSHA_LLM_KEY_SECRET 未设置}"
      # 会话 Cookie Secure 属性：HTTPS 反代后设 true（http 部署保持 false，否则浏览器不种）
      LIUSHA_COOKIE_SECURE: "${LIUSHA_COOKIE_SECURE:-false}"
      # 工作区宿主路径（文件 CRUD 面与沙盒 bind 源同值；容器内同路径挂载）
      LIUSHA_SANDBOX_WORKSPACE_DIR: "${HOST_WORKSPACE_DIR:-$HOME/data/liusha/workspace}"
    volumes:
      # config 只读挂载：LLM provider 等部署配置由仓库 config.yaml 表达——烘焙在
      # 镜像里用户改了无效；改后需重启容器（无热加载）。
      - ./config:/app/config:ro
      - ${HOST_DATA_DIR:-$HOME/data/liusha}/logs:/app/logs
      - ${HOST_WORKSPACE_DIR:-$HOME/data/liusha/workspace}:${HOST_WORKSPACE_DIR:-$HOME/data/liusha/workspace}
    depends_on: *app-deps
    # 仅绑回环：nginx 反代走 compose 网络不经宿主端口；对外入口只有 80/8588，
    # 控制面不直接暴露（本机调试 curl 127.0.0.1:8580 仍可达）。
    ports:
      - "127.0.0.1:${API_HOST_PORT:-58580}:8580"
    profiles: *full-profile
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8580/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s  # 空库首启：种子导入期间放行，避免被过早判 unhealthy

  # nginx：前置反代 + 前端 SPA 托管。/ → web/dist（多阶段构建内嵌），/api/* → api:8580。
  # 前端源码在仓库根 web/，与后端同仓（monorepo）。SSE 端点在 nginx.conf 里单独关缓冲。
  nginx:
    image: ${LIUSHA_IMAGE_REPO:-ghcr.io/v3teran}/liusha-nginx:${LIUSHA_IMAGE_TAG:-0.5.1} # x-release-please-version
    build:
      context: .
      dockerfile: deployments/nginx/Dockerfile
    container_name: liusha-nginx
    restart: unless-stopped
    environment:
      # 反代上游的 api 容器端口（渲染进 nginx.conf；与 api 的 LIUSHA_API_ADDR 端口一致）
      API_CONTAINER_PORT: "8580"
    ports:
      - "${NGINX_HOST_PORT:-50080}:80"
    profiles: *full-profile
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 3

  # cmd/proxy：内嵌 proxify SDK 的 MITM 代理 + filter/dedup/aggregator + Asynq 生产者
  proxy:
    image: ${LIUSHA_IMAGE_REPO:-ghcr.io/v3teran}/liusha-proxy:${LIUSHA_IMAGE_TAG:-0.5.1} # x-release-please-version
    build:
      context: .
      dockerfile: cmd/proxy/Dockerfile
    container_name: liusha-proxy
    restart: unless-stopped
    environment:
      <<: *app-env
      LIUSHA_PROXY_LISTEN_ADDR: 0.0.0.0:8588
      LIUSHA_PROXY_CERT_DIR: /app/certs
    volumes:
      - ./config:/app/config:ro
      - ${HOST_DATA_DIR:-$HOME/data/liusha}/proxy-certs:/app/certs
      - ${HOST_DATA_DIR:-$HOME/data/liusha}/logs:/app/logs
    ports:
      # 浏览器代理配 宿主IP:58588（容器内 8588）
      - "${PROXY_HOST_PORT:-58588}:8588"
    profiles: *full-profile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: *app-deps
    # proxy 纯 MITM，无 healthz HTTP——探 TCP 8588（mitm 口）是否在听。
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8588"]
      interval: 10s
      timeout: 3s
      retries: 3

  # runner：Asynq 消费者 + ReAct 引擎（不再装 mitm，已拆到 cmd/proxy）。
  runner:
    image: ${LIUSHA_IMAGE_REPO:-ghcr.io/v3teran}/liusha-runner:${LIUSHA_IMAGE_TAG:-0.5.1} # x-release-please-version
    build:
      context: .
      dockerfile: cmd/runner/Dockerfile
    container_name: liusha-runner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *app-env
      # LLM provider 密钥加密密钥：用于加密存储在数据库中的 API keys
      LIUSHA_LLM_KEY_SECRET: "${LIUSHA_LLM_KEY_SECRET:?LIUSHA_LLM_KEY_SECRET 未设置}"
      # 工作区宿主路径（文件 CRUD 面与沙盒 bind 源同值；容器内同路径挂载）
      LIUSHA_SANDBOX_WORKSPACE_DIR: "${HOST_WORKSPACE_DIR:-$HOME/data/liusha/workspace}"
      # embedding 密钥：缺失则 corpus 降级纯 sparse 检索（不 fail-fast）
      JINA_API_KEY: "${JINA_API_KEY:-}"
      # 沙盒流量回灌端点（8590 对外发布）的 Bearer：设值后 runner 与沙盒自动共享同一
      # token（launcher 透传）；空 = 开发模式不验——公网宿主必须设。
      LIUSHA_INGEST_TOKEN: "${LIUSHA_INGEST_TOKEN:-}"
      # 沙盒回连的宿主端口（58590 映射），与容器内监听 8590 区分
      LIUSHA_INGEST_PUBLIC_PORT: "58590"
      # 沙盒镜像与业务镜像同版本（与下方 sandbox 条目同一 tag，pull 时一并预拉/升级）
      LIUSHA_SANDBOX_DEFAULT_IMAGE: ${LIUSHA_IMAGE_REPO:-ghcr.io/v3teran}/liusha-sandbox:${LIUSHA_IMAGE_TAG:-0.5.1} # x-release-please-version
    volumes:
      - ./config:/app/config:ro
      - ${HOST_DATA_DIR:-$HOME/data/liusha}/logs:/app/logs
      - ${HOST_WORKSPACE_DIR:-$HOME/data/liusha/workspace}:${HOST_WORKSPACE_DIR:-$HOME/data/liusha/workspace}
      - /var/run/docker.sock:/var/run/docker.sock
      # 沙盒工作区持久层：宿主目录以同路径挂进容器（bind 源 = 容器内路径，
      # LIUSHA_SANDBOX_WORKSPACE_DIR 指宿主路径供沙盒 bind 使用）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: *app-deps
    # 58590 必须绑 0.0.0.0：沙盒容器经 host-gateway（宿主网桥 IP，非 127.0.0.1）
    # 回灌流量，绑回环会断沙盒链路。公网宿主务必设 LIUSHA_INGEST_TOKEN。
    ports:
      - "${RUNNER_HOST_PORT:-58590}:8590"
    profiles: *full-profile
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8590/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  # sandbox：不是常驻服务——runner 经 docker.sock 按需拉起（暖池管理）。本条目只为让
  # `compose pull` 预拉 / 升级沙盒镜像（约 6 GB）：否则首个任务现场下载卡很久，且
  # docker run 不会刷新本地已有 tag，升级后沙盒永远停在旧版。scale: 0 → up 不建容器。
  sandbox:
    image: ${LIUSHA_IMAGE_REPO:-ghcr.io/v3teran}/liusha-sandbox:${LIUSHA_IMAGE_TAG:-0.5.1} # x-release-please-version
    scale: 0
    profiles: *full-profile
