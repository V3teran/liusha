# liusha 多镜像部署：
#
#   cp .env.example .env                       # 填写密钥与容器部署的必填项
#   mkdir -p ~/data/liusha && cp internal/config/config.yaml ~/data/liusha/   # 配置文件（LIUSHA_DATA_DIR 改过就放到那里），按需修改
#   docker compose up -d --build               # 首次构建沙盒镜像约需半小时以上（Kali + 约 90 个工具）
#
# 服务：nginx（官方镜像，对外入口）→ api（控制台与 API）；proxy（MITM 代理入口）；runner（任务执行）；
# sandbox（工具执行沙盒，本地构建）；postgres；redis；migrate（一次性数据库迁移与出厂内容同步，成功退出后
# 业务服务才启动）。api / proxy / runner / migrate 是同一个 liusha 镜像的不同命令。
#
# 本地开发只起依赖：docker compose up -d postgres redis sandbox（见 scripts/dev/up.sh）。
#
# 配置文件与数据都在 LIUSHA_DATA_DIR（缺省 ~/data/liusha）下：配置文件 ${LIUSHA_DATA_DIR}/config.yaml
# 只读挂成各 liusha 容器的 /data/config.yaml（与单镜像同一位置），编辑宿主上的文件、重启服务生效；
# 文件不存在时拒绝启动（不让 Docker 在原处建出空目录）。liusha 的数据目录（data_dir）在容器里就是
# LIUSHA_DATA_DIR 这个宿主路径，workspace / logs / certs 以同一绝对路径挂进需要的容器：
# 附件清单交给 agent 的路径在 api 与沙盒两侧一致，宿主上直接运行的开发进程也看到同一路径。
#
# .env 由 docker compose 读取，只把各服务需要的变量逐个传进容器。其中不对应配置键的部署变量
# （数据库密码、宿主端口、镜像）只在这里使用，liusha 不读。

x-liusha-image: &liusha-image
  image: ${LIUSHA_IMAGE_REPO:-ghcr.io/v3teran}/liusha:${LIUSHA_IMAGE_TAG:-0.13.4} # x-release-please-version

# 数据目录与连接：所有 liusha 组件共用。连接串由数据库容器的密码拼出，密码缺失即拒绝启动。
x-liusha-env: &liusha-env
  LIUSHA_DATA_DIR: ${LIUSHA_DATA_DIR:-$HOME/data/liusha}
  LIUSHA_POSTGRES_URL: postgres://liusha:${LIUSHA_POSTGRES_PASSWORD:?LIUSHA_POSTGRES_PASSWORD 未设置}@postgres:5432/liusha?sslmode=disable
  LIUSHA_REDIS_URL: redis://:${LIUSHA_REDIS_PASSWORD:?LIUSHA_REDIS_PASSWORD 未设置}@redis:6379/0

# 访问沙盒：api 查询工具安装状态，runner 执行工具。
x-sandbox-env: &sandbox-env
  LIUSHA_SANDBOX_TOKEN: ${LIUSHA_SANDBOX_TOKEN:?LIUSHA_SANDBOX_TOKEN 未设置}
  LIUSHA_SANDBOX_URL: http://sandbox:8591

# 配置文件：liusha 镜像读 /data/config.yaml（LIUSHA_CONFIG）。
x-config: &config
  type: bind
  source: ${LIUSHA_DATA_DIR:-$HOME/data/liusha}/config.yaml
  target: /data/config.yaml
  read_only: true
  bind:
    create_host_path: false

x-logs: &logs ${LIUSHA_DATA_DIR:-$HOME/data/liusha}/logs:${LIUSHA_DATA_DIR:-$HOME/data/liusha}/logs
x-workspace: &workspace ${LIUSHA_DATA_DIR:-$HOME/data/liusha}/workspace:${LIUSHA_DATA_DIR:-$HOME/data/liusha}/workspace

x-ready: &ready
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  postgres:
    container_name: liusha-postgres
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: liusha
      POSTGRES_PASSWORD: ${LIUSHA_POSTGRES_PASSWORD:?LIUSHA_POSTGRES_PASSWORD 未设置}
      POSTGRES_DB: liusha
    # 只绑回环：数据库不对外；宿主上运行的开发进程经此端口连库
    ports:
      - "127.0.0.1:${LIUSHA_POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - ${LIUSHA_DATA_DIR:-$HOME/data/liusha}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liusha -d liusha"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    container_name: liusha-redis
    image: redis:8
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${LIUSHA_REDIS_PASSWORD:?LIUSHA_REDIS_PASSWORD 未设置}
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    ports:
      - "127.0.0.1:${LIUSHA_REDIS_HOST_PORT:-56379}:6379"
    volumes:
      - ${LIUSHA_DATA_DIR:-$HOME/data/liusha}/redis:/data
    healthcheck:
      # requirepass 下裸 ping 返回 NOAUTH，必须带密码
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    container_name: liusha-migrate
    <<: *liusha-image
    command: ["migrate"]
    restart: "no"
    environment: *liusha-env
    volumes:
      - *config
      - *logs
    depends_on:
      postgres:
        condition: service_healthy

  api:
    container_name: liusha-api
    <<: *liusha-image
    command: ["api"]
    restart: unless-stopped
    environment:
      <<: [*liusha-env, *sandbox-env]
      LIUSHA_ADMIN_INITIAL_PASSWORD: ${LIUSHA_ADMIN_INITIAL_PASSWORD:?LIUSHA_ADMIN_INITIAL_PASSWORD 未设置}
      LIUSHA_LLM_ENCRYPTION_KEY: ${LIUSHA_LLM_ENCRYPTION_KEY:?LIUSHA_LLM_ENCRYPTION_KEY 未设置}
    volumes:
      - *config
      - *workspace
      - *logs
    depends_on: *ready
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8580/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  nginx:
    container_name: liusha-nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${LIUSHA_CONSOLE_HOST_PORT:-50080}:80"
    volumes:
      - ./deployments/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy

  proxy:
    container_name: liusha-proxy
    <<: *liusha-image
    command: ["proxy"]
    restart: unless-stopped
    environment:
      <<: *liusha-env
      # 控制台「代理接入」显示的代理地址：容器内的 8588 映射到宿主的另一个端口，按宿主端口给出
      # （主机由控制台补为它自己的主机）；控制台与代理不在同一主机时在 .env 写完整地址。
      LIUSHA_PROXY_PUBLIC_ADDR: ${LIUSHA_PROXY_PUBLIC_ADDR:-:${LIUSHA_PROXY_HOST_PORT:-58588}}
    volumes:
      - *config
      - ${LIUSHA_DATA_DIR:-$HOME/data/liusha}/certs:${LIUSHA_DATA_DIR:-$HOME/data/liusha}/certs
      - *logs
    # 浏览器 / 客户端把 HTTP 代理指到「宿主 IP:58588」
    ports:
      - "${LIUSHA_PROXY_HOST_PORT:-58588}:8588"
    depends_on: *ready
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8588"]
      interval: 10s
      timeout: 3s
      retries: 3

  runner:
    container_name: liusha-runner
    <<: *liusha-image
    command: ["runner"]
    restart: unless-stopped
    # 停机时在途任务按中断收尾（至多 config.yaml 的 runner.drain_timeout_seconds，模板为 30 秒），
    # Docker 缺省的 10 秒宽限会在收尾中途强杀，run 残留 running。
    stop_grace_period: 45s
    environment:
      <<: [*liusha-env, *sandbox-env]
      LIUSHA_LLM_ENCRYPTION_KEY: ${LIUSHA_LLM_ENCRYPTION_KEY:?LIUSHA_LLM_ENCRYPTION_KEY 未设置}
      LIUSHA_EMBEDDING_API_KEY: ${LIUSHA_EMBEDDING_API_KEY:-} # 可选；空值不覆盖配置文件
      # 对外监听段：与 sandbox 发布的端口是同一个值（容器部署以 .env 为准，见 .env.example）
      LIUSHA_SANDBOX_LISTENER_PORTS: ${LIUSHA_SANDBOX_LISTENER_PORTS:?LIUSHA_SANDBOX_LISTENER_PORTS 未设置}
    volumes:
      - *config
      - *logs
    depends_on:
      <<: *ready
      sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8590/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  sandbox:
    container_name: liusha-sandbox
    image: liusha-sandbox:local
    build:
      context: .
      dockerfile: deployments/sandbox/Dockerfile
      args:
        VERSION: 0.13.4 # x-release-please-version
    restart: unless-stopped
    # tini 作 PID 1：回收命令结束后被托孤的后台进程（扫描器、浏览器子进程）
    init: true
    environment:
      LIUSHA_DATA_DIR: ${LIUSHA_DATA_DIR:-$HOME/data/liusha}
      LIUSHA_SANDBOX_TOKEN: ${LIUSHA_SANDBOX_TOKEN:?LIUSHA_SANDBOX_TOKEN 未设置}
      # 浏览器流量回灌 runner。宿主上直接运行 runner 的开发形态由 scripts/dev/up.sh 改指
      # host.docker.internal（LIUSHA_RUNNER_URL）。
      LIUSHA_RUNNER_URL: ${LIUSHA_RUNNER_URL:-http://runner:8590}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - *config
      - *workspace
      - *logs
    ports:
      # 只绑回环：供宿主上直接运行的开发进程访问；容器间走 compose 网络
      - "127.0.0.1:${LIUSHA_SANDBOX_HOST_PORT:-58591}:8591"
      # 对外监听段：反弹 shell / 代理 / payload 托管绑段内端口，目标经「回连地址:同号端口」直达。
      - "${LIUSHA_SANDBOX_LISTENER_PORTS:?LIUSHA_SANDBOX_LISTENER_PORTS 未设置}:${LIUSHA_SANDBOX_LISTENER_PORTS:?LIUSHA_SANDBOX_LISTENER_PORTS 未设置}"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8591/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
