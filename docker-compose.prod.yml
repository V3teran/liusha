# 生产形态 overlay：与 docker-compose.yml 叠加使用
#
# 用法（推荐 make prod-up，自动先跑迁移）：
#   make prod-up
# 或手动：
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.prod.yml \
#                  --env-file .env.prod up -d
# （迁移：host 侧 make migrate——postgres 容器把 5432 映射到宿主）
#
# 与默认（dev）的差异：
#   - LIUSHA_ENV=production  → stdout 走 JSON 单行（不再彩色 console）
#   - LIUSHA_LOG_FORMAT=json → 显式锁死，避免被其它环境变量翻转
#
# 文件日志保持开启（logx 默认 to-file=true）：logs/ 共享卷是「日志」页的数据面，
# api 进程尾读 logs/{process}.log 聚合展示三进程日志——关掉文件输出页面即空。

services:
  api:
    environment:
      LIUSHA_ENV: production
      LIUSHA_LOG_FORMAT: json

  proxy:
    environment:
      LIUSHA_ENV: production
      LIUSHA_LOG_FORMAT: json

  runner:
    environment:
      LIUSHA_ENV: production
      LIUSHA_LOG_FORMAT: json
