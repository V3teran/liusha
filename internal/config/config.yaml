# ============================================================================
# liusha 配置文件。程序启动时必须读到它，且必须列出下面的全部键：缺键、多出不认识的键都拒绝启动
# （多镜像部署的沙盒容器例外：它镜像里的程序可能落后于主程序，只认自己用到的键）。
#
# 放在哪：
#   - 二进制：与 liusha、.env 放在同一目录（发布压缩包里自带这份）；或 -config / LIUSHA_CONFIG 指定。
#   - 单镜像与多镜像：宿主上的 ~/data/liusha/config.yaml（多镜像为 ${LIUSHA_DATA_DIR}/config.yaml），
#     只读挂载为容器内的 /data/config.yaml。编辑宿主上的文件，重启生效。
#
# 环境变量：键 a.b_c 对应 LIUSHA_A_B_C（如 runner.concurrency → LIUSHA_RUNNER_CONCURRENCY），设置了
#   即覆盖本文件的值（值为空串时不覆盖）。本文件只写字面值，不引用变量。
# 密钥（postgres.url、redis.url、sandbox.token、llm.encryption_key、admin.initial_password）
#   在这里留空，经 .env 注入。检索模型密钥不在配置文件：前端「模型配置」页维护、加密落库。
# 这里列出全部可调的值，出厂值只在这一处。启动期参数改后重启生效；可热改的旋钮（runtime、compaction 两段，
#   以及 proxy 段里的过滤规则）同样在这里给出出厂值，前端「系统配置」页在其上做字段级自定义（存库、即时生效）。
# ============================================================================

# 持久数据根目录：任务工作区 workspace/、日志 logs/、MITM 根证书 certs/ 都在其下。
# 绝对路径或 ~/ 开头（当前用户主目录）。容器部署由镜像 / compose 改为 /data 或宿主同路径。
data_dir: ~/data/liusha

# ---- 日志 ----
log:
  level: info                        # debug / info / warn / error
  format: json                       # 标准输出的格式：json / console（文件永远是 json）
  to_stdout: true
  to_file: true                      # 写 <data_dir>/logs/<命令>.log，控制台「日志」页读它
  max_size_bytes: 104857600          # 单个日志文件的轮转大小（100 MiB；须为 1 MiB 的整数倍）
  max_backups: 7                     # 保留的轮转文件数；0 = 不按个数清理
  max_age_days: 14                   # 轮转文件保留天数；0 = 不按天数清理
  compress: true                     # 轮转文件 gzip 压缩

# ---- api：HTTP 入口 ----
api:
  listen_addr: 0.0.0.0:8580
  read_timeout_seconds: 15
  write_timeout_seconds: 30
  read_header_timeout_seconds: 5
  shutdown_timeout_seconds: 5
  cookie_secure: false               # 经 HTTPS 访问时设 true（会话 Cookie 加 Secure）；纯 http 必须 false

# ---- 初始管理员 ----
admin:
  initial_password: ""               # 密钥（LIUSHA_ADMIN_INITIAL_PASSWORD，8-72 字节）：账号表为空时创建 admin 用，之后在控制台改密

# ---- PostgreSQL（需安装 pgvector 扩展）----
postgres:
  url: ""                            # 密钥（LIUSHA_POSTGRES_URL）：postgres://用户:密码@主机:端口/库名?sslmode=disable
  max_conns: 20
  min_conns: 2                       # 常驻暖连接：闲置后的请求不必付一次新拨号
  connect_timeout_seconds: 5
  max_conn_lifetime_seconds: 3600

# ---- Redis ----
redis:
  url: ""                            # 密钥（LIUSHA_REDIS_URL）：redis://[用户名]:密码@主机:端口/库号，TLS 用 rediss://
  pool_size: 20                      # 订阅另走独立连接，不占这里的名额
  min_idle_conns: 0
  dial_timeout_seconds: 5
  read_timeout_seconds: 3
  write_timeout_seconds: 3

# ---- LLM ----
# LLM 接入（provider）与档位路由在前端「模型配置」页维护，密钥加密保存在数据库。
llm:
  encryption_key: ""                 # 密钥（LIUSHA_LLM_ENCRYPTION_KEY）：加密已保存的 provider 密钥，32 字节 hex（openssl rand -hex 32）；生成后不可更改
  # 每个模型账户同时在途的请求数上限（同一服务地址 + 同一密钥算一个账户，各 provider、各任务、各 agent 共用）。
  # 模型服务的限流随在途请求数而来：实测同一账户在途 4 个以内时限流接近零，5 个起陡增——所以
  # 上限设在账户上，不设在任务或 agent 上。超出的调用排队等名额，不发出去被拒。
  # 按账户的并发额度调：高阶额度、自建模型调大；0 = 不限。同时执行的任务数（runner.concurrency）
  # 乘以任务宽度远大于此值时，模型调用会大量时间花在排队上：调大此值，或调小任务并发。
  account_concurrency: 4
  # 错误码退避表（429/529/5xx/网络超时），所有调 LLM 的组件共用。
  # 429 取长尾：并发型限流的恢复窗口以十秒计。上游明确告知恢复时刻的限流按它给的时长等
  # （超过一分钟的额度窗口转入冷却，不走这张表）。每次退避施加等量抖动（[d/2, d)），
  # 并发 agent 的重试在时间窗内错峰。
  retry:
    max_429: 4
    max_529: 1
    max_5xx: 2
    max_net: 2
    backoff_429_seconds: [2, 8, 30, 60]
    backoff_5xx_seconds: [1, 4]
    backoff_net_seconds: [1, 3]
    backoff_529_ms: 0                # 529 立即重试
  invocation_retention_days: 0       # LLM 调用记录（含完整 prompt / response）留存天数；0 = 永久留存

# ---- tools / traffic：记录表留存 ----
# 运行过程记录（工具调用、流量）按天数清理；0 = 永久留存。任务证据（消息、探索图、
# 漏洞、知识）与审计链 audit_log 不按时间清理。
tools:
  invocation_retention_days: 0      # 工具调用记录留存天数；0 = 永久留存
traffic:
  retention_days: 0                 # 流量记录（代理捕获 + agent 自产，含消费关联行）留存天数；0 = 永久留存

# ---- proxy：MITM 代理入口 + 过滤规则出厂值 ----
proxy:
  listen_addr: 0.0.0.0:8588
  public_addr: ""                    # 客户端设置代理时填的地址（控制台「代理接入」显示）：主机:端口，或 :端口（主机即控制台所在主机）；空 = 由 listen_addr 推出
  stream_max_len: 100000             # 代理流量在 Redis 中等待摄入的缓冲上限（约 5 KiB × 1e5 ≈ 500 MiB）
  # 过滤规则（前端「系统配置 · 代理过滤」可自定义）
  allow_hosts: []                    # 主机白名单（空 = 放行全部）
  exclude_hosts: []                  # 主机黑名单（支持 *.example.com；黑名单优先）
  exclude_methods: [OPTIONS, HEAD, CONNECT]
  exclude_upgrade_protocols: [websocket]
  exclude_suffixes: [.css, .js, .png, .jpg, .gif, .ico, .woff, .woff2]   # 静态资源（大小写不敏感）
  exclude_content_types: []          # 支持 image/* 通配
  # 原始流量为 4xx/5xx 表示业务异常，测试无意义
  exclude_status_codes: [400, 401, 403, 404, 405, 408, 409, 410, 413, 414, 415, 422, 429, 500, 501, 502, 503, 504]
  max_request_body_bytes: 2097152    # 2 MiB
  max_response_body_bytes: 8388608   # 8 MiB

# ---- 代理流量攒批建任务（runner 内）----
ingestor:
  aggregate_batch_size: 20           # 同主机攒够这么多条即建一个代理捕获任务
  aggregate_window_seconds: 10       # 或距首条超过这么多秒（先到先触发）

# ---- runtime：工具与模型调用的运行时旋钮 ----
# 前端「系统配置 · 运行时」可热改（自定义存库、即时生效）；这里给出出厂值，键名与页面上的字段同名。
runtime:
  step_llm_timeout_seconds: 300      # 单次 LLM 调用的上限（单步看门狗）：挂死的调用即失败。规划一整轮的预算、压缩链的时限都由它推导
  step_tool_timeout_seconds: 1800    # run_command 的超时上限（模型自传的 timeout_seconds 不得超过它）
  run_tail_bytes: 8192               # run_command 输出保留尾部的字节数（输出末段是结果所在）
  tool_output_tail_bytes: 32768      # 任意工具输出进模型上下文前的全局尾部保留字节数（防单条结果撑爆上下文）

# ---- compaction：各角色会话历史的预算 ----
# 前端「系统配置 · 会话历史压缩」可热改；预算 = 比例 × 本角色所用模型的上下文窗口，超出部分的历史被裁并蒸馏成纪要。
# 比例越大上下文越完整、token 越贵；上限 0.9（给模型输出与 system 开销留余地）。
compaction:
  planner_context_ratio: 0.6         # 规划链路偏长推理，预算给大些
  executor_context_ratio: 0.5
  evaluator_context_ratio: 0.5
  monitor_context_ratio: 0.5

# ---- runner：任务执行 ----
runner:
  listen_addr: 0.0.0.0:8590          # healthz 与沙盒浏览器流量回灌
  url: http://127.0.0.1:8590         # 沙盒访问 runner 的地址
  read_header_timeout_seconds: 5
  shutdown_timeout_seconds: 5
  # 同时执行的任务数。一个任务平均占 3–4 个在途名额（llm.account_concurrency 缺省 4），三个任务就把
  # 一个缺省账户占满；再多的任务只是让每个调用排队更久——排到单步预算的一半仍拿不到名额的调用会放弃，
  # 被交还的动作要从头重做（按排队规则仿真：3 个任务时 2.5% 的调用放弃、5% 的已完成步数作废；
  # 10 个任务时是 72% 与 40%）。所以缺省 3，并随账户额度一起调：任务数约为账户在途上限的四分之三
  # （上限 8 配 6 个，16 配 12 个；多个账户按在途上限之和估算）。
  concurrency: 3                     # 同时执行的任务数
  # 任务宽度：一个任务想跑多宽。它们不是对模型账户的保护——同一账户同时在途的请求数由 LLM 层按
  # llm.account_concurrency 统一限制，超出的调用排队等名额。
  action_parallelism: 4              # 一个任务同时执行的动作数上限；目标不容忍并发访问（顶掉登录态、对并发断连）时降到 1–2，1 = 串行
  verification_parallelism: 3        # 评估者同时验证的假设数上限
  monitor_interval_seconds: 360      # 监察者两次全局评估的间隔；每次评估是一次完整的状态通读，调小更及时、也更费
  drain_timeout_seconds: 30          # 停机时等在途 run 中断收尾（终态回写、释放沙盒）的上限
  agent_run_timeout_seconds: 0       # 单次 run 墙钟上限；0 = 不限（收敛交给完成检测，正数是防失控的护栏）
  max_actions_per_task: 0            # 动作预算：单任务最多执行的动作数；0 = 不限
  # 僵尸 run 回收：巡检周期 / 一轮 run 的存活心跳多久没有续约判为僵尸 / 单任务自动重投上限（按出错的
  # run 计数，超限任务终止，防崩溃循环烧 LLM 额度）。心跳每 30 秒续约一次，只在这轮 run 有新的操作开始、
  # 或有未到期的在途操作时续约：进程被硬杀、或活着但卡住了都会停止续约，而在等一个有超时的长操作时不会。
  # 120 秒即连续四次没有续约；须不小于 90 秒。
  run_recovery_interval_seconds: 30
  run_recovery_timeout_seconds: 120
  run_recovery_max_attempts: 4

# ---- sandbox：工具执行沙盒 ----
sandbox:
  listen_addr: 127.0.0.1:8591
  url: http://127.0.0.1:8591         # runner / api 访问沙盒的地址
  token: ""                          # 密钥（LIUSHA_SANDBOX_TOKEN）：沙盒与 runner / api 的共享密钥（openssl rand -hex 32）
  shell: ""                          # 执行 agent 命令的 POSIX shell（名字或绝对路径）；空 = 在本机查找：PATH 中的 sh，Windows 上再找 Git for Windows 的 sh.exe
  browser_python: ""                 # 运行浏览器服务的 Python（需装 browser-use）；空 = 本机惯用名 python3（Windows 为 python）
  viewport_width: 1280               # 浏览器视口：主流桌面宽度，截图喂视觉模型的 token 甜点区
  viewport_height: 800
  workspace_retention_days: 0        # 任务工作区留存天数；0 = 永久保留（工件是证据）
  # 对外监听段：反弹 shell / 代理 / payload 托管绑段内端口；空 = 不提供。须避开业务端口与临时端口段
  # （Linux 32768+）。单镜像 / 多镜像要按它发布端口，在 .env 里写定 LIUSHA_SANDBOX_LISTENER_PORTS（覆盖这里）。
  listener_ports: "21000-21299"
  # 目标回连地址（payload 里写它）：宿主对目标可达的 IP 或域名。空 = 探测本机默认路由的源地址；
  # 容器里探测到的是容器网地址，单镜像 / 多镜像以及 NAT、多网卡时须填写。
  callback_host: ""

# ---- 会话 ----
conversation:
  attachment_max_bytes: 104857600    # 单附件上传上限（100 MiB：大 pcap 与字典文件不设卡）
