<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- 深色背景 -->
    <radialGradient id="bgGrad">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </radialGradient>
    
    <!-- 剑身金属渐变 -->
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a0000;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a0000;stop-opacity:1" />
    </linearGradient>
    
    <!-- 流沙渐变 -->
    <linearGradient id="sand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#78350f;stop-opacity:0.5" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#78350f;stop-opacity:0.5" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <circle cx="60" cy="60" r="56" fill="url(#bgGrad)"/>
  <circle cx="60" cy="60" r="52" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- 鲨齿剑 -->
  <g filter="url(#glow)">
    <!-- 剑尖 -->
    <path d="M 60 15 L 64 22 L 60 20 L 56 22 Z" fill="#ef4444"/>
    
    <!-- 剑身主体 -->
    <rect x="56" y="22" width="8" height="60" fill="url(#blade)"/>
    
    <!-- 右侧锯齿 -->
    <path d="M 64 22 
             L 67 26 L 64 30 
             L 67 34 L 64 38 
             L 67 42 L 64 46 
             L 67 50 L 64 54 
             L 67 58 L 64 62 
             L 67 66 L 64 70 
             L 67 74 L 64 78 
             L 66 82" 
          fill="#991b1b"/>
    
    <!-- 左侧锯齿 -->
    <path d="M 56 22 
             L 53 26 L 56 30 
             L 53 34 L 56 38 
             L 53 42 L 56 46 
             L 53 50 L 56 54 
             L 53 58 L 56 62 
             L 53 66 L 56 70 
             L 53 74 L 56 78 
             L 54 82" 
          fill="#991b1b"/>
    
    <!-- 剑刃中心高光 -->
    <rect x="59" y="22" width="2" height="60" fill="#fca5a5" opacity="0.6"/>
  </g>
  
  <!-- 护手 -->
  <rect x="48" y="82" width="24" height="4" rx="2" fill="#1a1a1a" stroke="#dc2626" stroke-width="2"/>
  
  <!-- 剑柄 -->
  <rect x="57" y="86" width="6" height="16" fill="#2a0000"/>
  <line x1="57" y1="89" x2="63" y2="89" stroke="#dc2626" stroke-width="1"/>
  <line x1="57" y1="93" x2="63" y2="93" stroke="#dc2626" stroke-width="1"/>
  <line x1="57" y1="97" x2="63" y2="97" stroke="#dc2626" stroke-width="1"/>
  
  <!-- 剑首 -->
  <circle cx="60" cy="103" r="3" fill="#dc2626"/>
  
  <!-- 流沙效果 -->
  <g opacity="0.9">
    <path d="M 20 45 Q 40 42 60 45 Q 80 48 100 45" 
          stroke="url(#sand)" 
          stroke-width="2.5" 
          fill="none" 
          stroke-linecap="round">
      <animate attributeName="d" 
               values="M 20 45 Q 40 42 60 45 Q 80 48 100 45;
                       M 20 45 Q 40 48 60 45 Q 80 42 100 45;
                       M 20 45 Q 40 42 60 45 Q 80 48 100 45" 
               dur="4s" 
               repeatCount="indefinite"/>
    </path>
    
    <path d="M 20 75 Q 40 78 60 75 Q 80 72 100 75" 
          stroke="url(#sand)" 
          stroke-width="3" 
          fill="none" 
          stroke-linecap="round">
      <animate attributeName="d" 
               values="M 20 75 Q 40 78 60 75 Q 80 72 100 75;
                       M 20 75 Q 40 72 60 75 Q 80 78 100 75;
                       M 20 75 Q 40 78 60 75 Q 80 72 100 75" 
               dur="4s" 
               begin="0.5s"
               repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- 沙粒 -->
  <circle cx="35" cy="45" r="1.5" fill="#f59e0b" opacity="0.7">
    <animate attributeName="cy" values="45;40;45" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="85" cy="45" r="1.5" fill="#f59e0b" opacity="0.7">
    <animate attributeName="cy" values="45;40;45" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="77" r="1.2" fill="#b45309" opacity="0.6">
    <animate attributeName="cy" values="77;82;77" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="77" r="1.2" fill="#b45309" opacity="0.6">
    <animate attributeName="cy" values="77;82;77" dur="4.2s" repeatCount="indefinite"/>
  </circle>
</svg>
