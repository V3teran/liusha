<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="hexBg">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050505;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d491;stop-opacity:1" />
      <stop offset="45%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b4a0a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 六边形令牌（简化：小尺寸下省去流沙纹与内圈，保留识别力） -->
  <polygon
    points="58.7,32 46.3,54.6 21.7,54.6 9.3,32 21.7,9.4 46.3,9.4"
    fill="url(#hexBg)"
    stroke="url(#gold)"
    stroke-width="2"
  />

  <!-- 沙漏 -->
  <rect x="24" y="18" width="16" height="2" rx="1" fill="url(#gold)" />
  <rect x="24" y="44" width="16" height="2" rx="1" fill="url(#gold)" />
  <polygon points="25,20.5 39,20.5 32,31.5" fill="none" stroke="url(#gold)" stroke-width="1.4" />
  <polygon points="25,43.5 39,43.5 32,32.5" fill="url(#gold)" />
</svg>
