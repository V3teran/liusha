<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="流沙 · 鲨齿剑">
  <!-- ============================================================
       流沙 LIUSHA · 鲨齿剑徽记（v10 · 黑白灰阶 · 展示稿）
       定位：全灰阶"展示稿"——品牌手册、中灰底、大尺寸呈现用，
       是全部应用态（剪影/图标/组合标）的几何母版。
       应用态遵循正负形成对：深底用 mark-white（反白），浅底用
       mark-black（黑白）；图标用 app-icon / app-icon-light。
       深浅极端底上剑具/剑脊明度会逼近背景，勿直接贴极端底使用。
       设计：45° 下劈几何刃；三枚深钩鲨齿（前缘陡直 / 后缘内凹 /
       齿尖后掠约 30°）；两端微扬的六棱护手（犄角护手）；
       白色菱形剑首寒光；柄端三粒流沙尾迹。
       色彩：黑白灰阶——全部取主题强调色 oklch(*% 0.02 250) 的
       精确色度（彩度 0.02 即"黑白"），仅明度变化：
       剑脊 L85 = 深色主题强调色原值 #c4cfdb；
       剑刃 L60 / 剑具 L40 = 强调色明度区间（35–85）内插；
       剑首 L94 = 全图唯一高光（寒光）。
       几何：下刃单一直线段（剑尖→V3）；齿后缘 Q 控制点低于齿尖 y
       消除过冲；剑脊棱面（血槽）贴剑脊一侧与剑脊严格平行
       （同斜率 0.16622），宽度随剑身锥度从 1.4 收窄至尖点。
       ============================================================ -->
  <defs>
    <linearGradient id="bladeGrad" gradientUnits="userSpaceOnUse" x1="25.5" y1="0" x2="45" y2="0">
      <stop offset="0" stop-color="#c4cfdb"/>
      <stop offset="1" stop-color="#77818c"/>
    </linearGradient>
  </defs>
  <g transform="translate(5.6 5.7) rotate(-45 32 32)">
    <!-- 流沙尾迹（三粒沙，自剑柄方向飘散渐隐）-->
    <circle cx="32" cy="-2.2" r="2.3" fill="#e2edf8" opacity="0.85"/>
    <circle cx="32" cy="-7" r="1.5" fill="#a5afba" opacity="0.6"/>
    <circle cx="32" cy="-11" r="1.05" fill="#c4cfdb" opacity="0.4"/>
    <!-- 剑刃：直线剑脊；下刃单一直线段剑尖→V3；
         齿前缘(朝剑尖侧,陡直) V→A；齿后缘(朝剑柄侧,内凹) A→Q→V -->
    <path d="M26 23.2 L32.2 60.5 L35.7 46 L40.6 44.4 Q37.1 44.7 36.5 39.2 L42.4 37.4 Q38.1 37.7 37.4 32.2 L44.1 30.6 Q39.2 30.9 38.3 23.4 Z" fill="url(#bladeGrad)"/>
    <!-- 剑脊棱面（血槽）：贴脊边与剑脊严格平行，随锥度收窄成尖，
         顶端藏于护手之下 -->
    <path d="M27.23 24 L28.63 24 L31.64 50.5 Z" fill="#f1f5f9" fill-opacity="0.4"/>
    <!-- 剑柄茎 -->
    <path d="M30.2 12.5 L33.8 12.5 L33.8 19.5 L30.2 19.5 Z" fill="#404952"/>
    <!-- 犄角护手：两端微微上扬的六棱护手 -->
    <path d="M15.5 20.2 L18.6 18.8 L45.4 18.8 L48.5 20.2 L46 24.4 L18 24.4 Z" fill="#404952"/>
    <!-- 剑首寒光（菱形，下尖深插剑柄）-->
    <path d="M32 2.4 L36.6 8.5 L32 16.4 L27.4 8.5 Z" fill="#e2edf8"/>
  </g>
</svg>
