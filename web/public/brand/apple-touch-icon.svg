<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none" role="img" aria-label="流沙">
  <!-- 流沙 · iOS 主屏图标源（v11 · 默认浅色系）：全出血方形（不预圆角——
       系统自行裁圆角，预圆角会造成双重圆角与透明脏边）。
       黑剪影 + 白容器，同 app-icon.svg。用于渲染 apple-touch-icon.png（180×180）。 -->
  <defs>
    <linearGradient id="containerGrad" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7eaef"/>
    </linearGradient>
  </defs>

  <rect width="180" height="180" fill="url(#containerGrad)"/>

  <!-- 鲨齿剑 · 黑剪影（几何同 mark.svg v9）-->
  <g transform="translate(20.9 20.9) scale(2.16) translate(5.6 5.7) rotate(-45 32 32)" fill="#1a222b">
    <circle cx="32" cy="-2.2" r="2.3" opacity="0.9"/>
    <circle cx="32" cy="-7" r="1.5" opacity="0.7"/>
    <circle cx="32" cy="-11" r="1.05" opacity="0.5"/>
    <path d="M26 23.2 L32.2 60.5 L35.7 46 L40.6 44.4 Q37.1 44.7 36.5 39.2 L42.4 37.4 Q38.1 37.7 37.4 32.2 L44.1 30.6 Q39.2 30.9 38.3 23.4 Z"/>
    <path d="M30.2 12.5 L33.8 12.5 L33.8 19.5 L30.2 19.5 Z" opacity="0.85"/>
    <path d="M15.5 20.2 L18.6 18.8 L45.4 18.8 L48.5 20.2 L46 24.4 L18 24.4 Z" opacity="0.85"/>
    <path d="M32 2.4 L36.6 8.5 L32 16.4 L27.4 8.5 Z"/>
  </g>
</svg>
