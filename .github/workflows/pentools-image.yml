name: pentools image

# 构建 liusha/pentools 沙箱镜像（Kali 底座 + 全量工具 + sandbox-server）并推 GHCR。
# 与 ci.yml 分开：pentools 重（~GB 级），只在相关文件改动时才跑。
# amd64-only：开源发行目标平台，用原生 amd64 runner 构建，直接跑 Kali amd64 apt，不走 QEMU。

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'deployments/tool-images/pentools/**'
      - 'scripts/build/install-from-manifest.sh'
      - 'cmd/sandbox-server/**'
      - 'internal/sandbox/**'
      - '.github/workflows/pentools-image.yml'
  pull_request:
    paths:
      - 'deployments/tool-images/pentools/**'
      - 'scripts/build/install-from-manifest.sh'
      - 'cmd/sandbox-server/**'
      - 'internal/sandbox/**'
      - '.github/workflows/pentools-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pentools-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 原生 amd64 runner：直接跑 Kali amd64 apt，不走 QEMU。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # Kali 全量镜像大，标准 runner 默认空间可能不足——清掉用不到的预装大件。
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          docker image prune -af || true
          echo "After:"; df -h /

      - name: Resolve image name (lowercase)
        id: prep
        run: |
          owner=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/liusha-pentools" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deployments/tool-images/pentools/Dockerfile
          platforms: linux/amd64
          # PR 只构建验证（load 到本地），不推 GHCR；push/tag 才推。
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
