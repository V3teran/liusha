name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 运行 vet/gofmt/单元+集成测试：集成用例里的 testcontainers 会在 ubuntu-latest 上拉起真实 pg17。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - name: vet
        run: go vet ./...
      - name: vet (windows / darwin)
        # 平台专有实现（Windows 的作业对象、服务、文件权限；macOS 的进程枚举）只在对应 GOOS 下参与编译。
        run: GOOS=windows go vet ./... && GOOS=darwin go vet ./...
      - name: gofmt
        run: |
          diff=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))
          if [ -n "$diff" ]; then
            echo "gofmt diff:" && echo "$diff" && exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: golangci-lint (windows)
        uses: golangci/golangci-lint-action@v8
        env:
          GOOS: windows
        with:
          version: v2.15.0
      - name: terminology gate
        run: scripts/lint-terminology.sh
      - name: unit tests
        run: go test -race -short ./...
      - name: integration tests
        # 集成测试文件带 //go:build integration 约束：不加 tag 时根本不参与编译（此前
        # `-run Integration` 按名字过滤，实际一个集成用例都没跑过）。dbtest 经 testcontainers
        # 在 runner 上拉起真实 pgvector/pg17。
        run: go test -race -tags=integration ./...

  macos:
    # macOS 原生运行：全部单测在真实 macOS 上跑（进程归属经 sysctl 读取进程环境、launchd 下的
    # 运行方式与 Linux 不同）。集成测试依赖 Linux 容器，只在 test 作业跑。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: unit tests
        run: go test -race -short ./...

  windows:
    # Windows 原生运行：全部单测在真实 Windows 上跑（作业对象、Windows 服务、文件权限等平台实现，
    # 以及路径、换行、编码等跨平台假设）。沙盒命令经 Git Bash 的 sh 执行；浏览器客户端协议测试
    # 需要 Python。集成测试依赖 Linux 容器，只在 test 作业跑。
    runs-on: windows-latest
    steps:
      - name: 保持仓库换行原样（测试按字节比对脚本与输出）
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: unit tests
        shell: bash
        run: go test -race -short ./...

  web:
    # 前端：类型检查（含测试文件）+ 生产构建 + 单测。与 nginx/single 镜像同一 node 22 + corepack pnpm。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: build (tsc -b + vite build)
        run: pnpm build
      - name: unit tests
        run: pnpm test

  build:
    # 通过测试后再构建镜像，避免在失败的源码上浪费构建时间。
    runs-on: ubuntu-latest
    needs: [test, macos, windows, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build liusha image
        run: docker build -t liusha:ci .