name: security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  leaks:
    # 全历史密钥扫描：公开仓库的最低门槛，白名单见 .gitleaks.toml。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
