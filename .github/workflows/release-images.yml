name: release-images

# Release 发布 → 构建业务镜像（api / proxy / runner / nginx）并推送，标签由
# docker/metadata-action 生成：X.Y.Z、X.Y、latest。latest 即「最新正式版」，
# 只随 Release 移动；平时提交不构建镜像。
# 发版链：conventional commits → release-please 维护版本 PR → merge 出 Release → 本 workflow。
# 手动重建某版本：gh workflow run release-images.yml --ref vX.Y.Z（只接受 tag ref）。
# sandbox 镜像（约 6 GB）由 build-sandbox 在沙盒源码变更时构建，以推送头提交的 sha 打标签；
# 发版时本 workflow 的 sandbox job 找出与本版本沙盒源码一致的那个镜像，在 registry 层
# 重打标签（→ X.Y.Z / X.Y / latest），不重建——与业务镜像同版本号，compose 用同一
# LIUSHA_IMAGE_TAG 拉齐两者。

on:
  release:
    types: [published]
  workflow_dispatch:

# 同一版本的构建串行，不互相取消（重建不会被打断成半推送状态）。
concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: read # sandbox job 查询 build-sandbox 运行状态

jobs:
  images:
    # 只从版本 tag 构建：误在分支上手动触发直接跳过，杜绝未发版代码占用 latest。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: cmd/api/Dockerfile
          - name: proxy
            file: cmd/proxy/Dockerfile
          - name: runner
            file: cmd/runner/Dockerfile
          - name: nginx
            file: deployments/nginx/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # ghcr 镜像名必须小写（仓库属主 V3teran 含大写）
          images: ghcr.io/v3teran/liusha-${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN 的 packages:write 只覆盖包首次创建——包与仓库关联
          # 建立后增量推被拒（0.2.0 首推成功、0.3.0 write_package denied
          # 实测），与 build-sandbox 同用 PAT。
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # 含 org.opencontainers.image.source（GHCR 据此把包关联到仓库）/ revision / version
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  sandbox:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      SANDBOX_IMAGE: ghcr.io/v3teran/liusha-sandbox
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 查找沙盒源码最后一次改动需要完整历史

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      # 发版前刚推的沙盒改动可能还在构建：先等它跑完（失败则本 job 失败）。
      - name: Wait for in-flight sandbox builds
        run: |
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow build-sandbox.yml --branch main \
                        --json databaseId,status -q '.[]|select(.status!="completed")|.databaseId'); do
            echo "等待 build-sandbox run $id"
            gh run watch "$id" -R "$GITHUB_REPOSITORY" --exit-status
          done

      # 晋升与本版本沙盒源码一致的镜像，而不是当时恰好叫 :main 的镜像——后者在构建失败
      # 或漏触发时会悄悄指向旧版本。找不到对应镜像即失败，不发过期沙盒。
      - name: Promote sandbox to release tags
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MINOR="${VERSION%.*}"
          SRC=$(scripts/ci/sandbox-image-for.sh "$SANDBOX_IMAGE" "$GITHUB_SHA")
          echo "晋升 $SRC → $VERSION, $MINOR, latest"
          docker buildx imagetools create \
            --tag "$SANDBOX_IMAGE:$VERSION" \
            --tag "$SANDBOX_IMAGE:$MINOR" \
            --tag "$SANDBOX_IMAGE:latest" \
            "$SRC"
          docker buildx imagetools inspect "$SANDBOX_IMAGE:$VERSION"
