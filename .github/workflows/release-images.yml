name: release-images

# Release 发布 → 构建业务镜像（api / proxy / runner / nginx）并推送，标签由
# docker/metadata-action 生成：X.Y.Z、X.Y、latest。latest 即「最新正式版」，
# 只随 Release 移动；平时提交不构建镜像。
# 发版链：conventional commits → release-please 维护版本 PR → merge 出 Release → 本 workflow。
# 手动重建某版本：gh workflow run release-images.yml --ref vX.Y.Z（只接受 tag ref）。
# sandbox 镜像走独立的 build-sandbox 门控。

on:
  release:
    types: [published]
  workflow_dispatch:

# 同一版本的构建串行，不互相取消（重建不会被打断成半推送状态）。
concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    # 只从版本 tag 构建：误在分支上手动触发直接跳过，杜绝未发版代码占用 latest。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: cmd/api/Dockerfile
          - name: proxy
            file: cmd/proxy/Dockerfile
          - name: runner
            file: cmd/runner/Dockerfile
          - name: nginx
            file: deployments/nginx/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # ghcr 镜像名必须小写（仓库属主 V3teran 含大写）
          images: ghcr.io/v3teran/liusha-${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN 的 packages:write 只覆盖包首次创建——包与仓库关联
          # 建立后增量推被拒（0.2.0 首推成功、0.3.0 write_package denied
          # 实测），与 build-sandbox 同用 PAT。
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # 含 org.opencontainers.image.source（GHCR 据此把包关联到仓库）/ revision / version
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
