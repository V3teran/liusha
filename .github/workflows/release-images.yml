name: release-images

# 业务镜像（api / proxy / runner / nginx）双通道发布，标签由 docker/metadata-action 生成：
#
#   通道     触发                         标签                      给谁
#   stable   Release 发布（tag vX.Y.Z）   X.Y.Z、X.Y、latest        正式用户（compose 缺省拉 latest）
#   edge     push main                    edge、sha-<短哈希>        尝鲜 / 测试环境，未发版代码
#
# latest 只随 Release 移动——它是「最新正式版」，绝不指向未发版 commit。
# 发版链：conventional commits → release-please 维护版本 PR → merge 出 Release → stable 通道。
# 手动重建：gh workflow run release-images.yml --ref vX.Y.Z（重推该版本 + latest）；
#           --ref main 等同 edge 通道。sandbox 镜像走独立的 build-sandbox 门控。

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.agents/**'
      - 'LICENSE'
  workflow_dispatch:

# 同一 ref 只保留最新一次构建：main 上连续提交时旧 edge 构建作废；Release 不取消。
concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: cmd/api/Dockerfile
          - name: proxy
            file: cmd/proxy/Dockerfile
          - name: runner
            file: cmd/runner/Dockerfile
          - name: nginx
            file: deployments/nginx/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # ghcr 镜像名必须小写（仓库属主 V3teran 含大写）
          images: ghcr.io/v3teran/liusha-${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN 的 packages:write 只覆盖包首次创建——包与仓库关联
          # 建立后增量推被拒（0.2.0 首推成功、0.3.0 write_package denied
          # 实测），与 build-sandbox 同用 PAT。
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # 含 org.opencontainers.image.source（GHCR 据此把包关联到仓库）/ revision / version
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
