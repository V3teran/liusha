name: release-images

# Release 发布 → 自动构建业务镜像并推送（版本号 + latest 双标签）。
# 发布链闭环：conventional commits → release-please（版本 PR）→ merge 出
# Release → 本 workflow 构建镜像。ghcr.io 用 GITHUB_TOKEN（packages:write
# 作用于本仓库自有包，无需 PAT）；sandbox 镜像走独立的 build-sandbox 门控。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本号（不带 v 前缀，如 0.2.0）；空 = 只推 latest'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Resolve image tags
        id: tags
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          # ghcr 镜像名必须小写
          OWNER=$(printf 'ghcr.io/%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          # Release → v0.2.0 镜像标签 0.2.0 + latest（tag 带 v，镜像不带）；
          # 手动触发带 version 参数 → 版本+latest；不带 → 只推 latest。
          # tags 用逗号单行拼接（build-push-action 原生多 tag 语法）——
          # 多行 output 经表达式插值会折叠变形（两次实测 invalid tag）。
          if [ "$EVENT" = "release" ]; then
            VERSION="${REF_NAME#v}"
          elif [ -n "$DISPATCH_VERSION" ]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION=""
          fi
          if [ -n "$VERSION" ]; then
            SUFFIX="$VERSION,latest"
          else
            SUFFIX="latest"
          fi
          {
            API=""; for t in ${SUFFIX//,/ }; do API="$API,$OWNER/liusha-api:$t"; done
            PROXY=""; RUNNER=""; NGINX=""
            for t in ${SUFFIX//,/ }; do
              PROXY="$PROXY,$OWNER/liusha-proxy:$t"
              RUNNER="$RUNNER,$OWNER/liusha-runner:$t"
              NGINX="$NGINX,$OWNER/liusha-nginx:$t"
            done
            echo "api=${API#,}"
            echo "proxy=${PROXY#,}"
            echo "runner=${RUNNER#,}"
            echo "nginx=${NGINX#,}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.api }}
          labels: org.opencontainers.image.source=https://github.com/V3teran/liusha

      - name: Build and push proxy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/proxy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.proxy }}
          labels: org.opencontainers.image.source=https://github.com/V3teran/liusha

      - name: Build and push runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.runner }}
          labels: org.opencontainers.image.source=https://github.com/V3teran/liusha

      - name: Build and push nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/nginx/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.nginx }}
          labels: org.opencontainers.image.source=https://github.com/V3teran/liusha
