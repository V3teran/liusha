name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # 从 Conventional Commits 维护 CHANGELOG + 版本 PR（merge 即出 GitHub Release + tag）。
    # 0.y.z 阶段：MINOR 随 feat 推进，fix 进 PATCH——语义上不承诺稳定。
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # 默认 GITHUB_TOKEN 受仓库设置限制不能创建 PR（实测 failure），PAT 以
          # 所有者名义开 PR 绕开该限制；GHCR_PAT 具 repo 权限。
          token: ${{ secrets.GHCR_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
