name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # 从 Conventional Commits 维护 CHANGELOG + 版本 PR（merge 即出 GitHub Release + tag）。
    # 0.y.z 阶段：MINOR 随 feat 推进，fix 进 PATCH——语义上不承诺稳定。
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # 默认 GITHUB_TOKEN 受仓库设置限制不能创建 PR（实测 failure），PAT 以
          # 所有者名义开 PR 绕开该限制；GHCR_PAT 具 repo 权限。
          token: ${{ secrets.GHCR_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please 的模板把破坏性变更一节的标题写死为英文：Release PR 创建或更新后改为中文
      - uses: actions/checkout@v4
        if: steps.release.outputs.prs_created == 'true'
        with:
          token: ${{ secrets.GHCR_PAT }}
      - name: 发布说明标题改为中文
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
          PRS: ${{ steps.release.outputs.prs }}
        # 提交以 PAT 所有者（与 Release PR 同一身份）署名：署名 github-actions[bot] 会让它
        # 随发版合并进 main，出现在仓库的贡献者列表里。
        run: |
          read -r login id < <(gh api user --jq '"\(.login) \(.id)"')
          git config user.name "$login"
          git config user.email "$id+$login@users.noreply.github.com"
          scripts/release/localize-notes.sh "$PRS"
