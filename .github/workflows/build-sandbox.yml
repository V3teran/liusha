name: Build and Test Sandbox Images

# 每次推送 main 都运行，是否构建由 check-changed 按沙盒源码判定（十几秒的空跑）。
# 不用 on.paths 过滤：那是一份手写路径清单，曾漏掉 internal/logx、go.mod、vendor 等
# 编进 sandbox-server 的输入，相关改动不触发重建，发版晋升过期镜像。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_base:
        description: '强制重建基础镜像'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  BASE_IMAGE: ghcr.io/v3teran/liusha-sandbox-base
  FINAL_IMAGE: ghcr.io/v3teran/liusha-sandbox

jobs:
  # ============================================================================
  # Stage 1: 变更门控（base 门 / final 门分离）
  # ============================================================================
  check-changed:
    runs-on: ubuntu-24.04
    outputs:
      should_build_base: ${{ steps.check.outputs.should_build_base }}
      should_build_final: ${{ steps.check.outputs.should_build_final }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要整次推送的基线 commit（github.event.before）

      - name: Check what changed
        id: check
        env:
          EVENT: ${{ github.event_name }}
          REBUILD_BASE: ${{ inputs.rebuild_base }}
          BEFORE: ${{ github.event.before }}
        run: |
          emit() { echo "should_build_base=$1" >> "$GITHUB_OUTPUT"; echo "should_build_final=$2" >> "$GITHUB_OUTPUT"; }

          # 手动触发：意图即重建 final；勾选 rebuild_base 时连 base 一起（base 变更蕴含 final）。
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "手动触发：final 重建，base=${REBUILD_BASE:-false}"
            emit "${REBUILD_BASE:-false}" true
            exit 0
          fi

          # push：比较整次推送范围 before..sha。只看 HEAD^..HEAD 会漏——一次推多个
          # commit 而沙盒改动不在最后一个时，沙盒不重建，发版找不到对应镜像。
          # before 全零（新建分支）或不在历史中（force push 改写）→ 无可靠基线，全量构建。
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "无可靠基线（before=$BEFORE），全量构建"
            emit true true
            exit 0
          fi
          # 沙盒源码由 Dockerfile 推导（scripts/ci/sandbox-inputs.sh），与发版查找对应镜像同源。
          # base 门：base 的输入；final 门：final 的输入（含 base 的输入）。
          mapfile -t BASE_INPUTS < <(scripts/ci/sandbox-inputs.sh base)
          mapfile -t FINAL_INPUTS < <(scripts/ci/sandbox-inputs.sh final)
          echo "=== 本次推送改动的沙盒源码（$BEFORE..$GITHUB_SHA）==="
          git diff --name-only "$BEFORE" "$GITHUB_SHA" -- "${FINAL_INPUTS[@]}"
          base=false; final=false
          git diff --quiet "$BEFORE" "$GITHUB_SHA" -- "${BASE_INPUTS[@]}" || base=true
          git diff --quiet "$BEFORE" "$GITHUB_SHA" -- "${FINAL_INPUTS[@]}" || final=true
          echo "base=$base final=$final"
          emit "$base" "$final"

  # ============================================================================
  # Stage 2: 构建并推送基础镜像（直接推送，不保存 artifact）
  # ============================================================================
  build-base:
    needs: check-changed
    if: needs.check-changed.outputs.should_build_base == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    # arm64 用原生 arm runner（公开仓库免费）——8-10GB 的 apt 安装走 QEMU 不现实，
    # 交叉装包也不可能；原生构建是双架构镜像唯一可行的产出路径。
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "=== 清理前磁盘空间 ==="
          df -h
          echo ""
          echo "=== 删除不需要的软件 ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo docker image prune --all --force
          sudo apt-get clean
          echo ""
          echo "=== 清理后磁盘空间 ==="
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/tool-images/sandbox/Dockerfile.base
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ${{ env.BASE_IMAGE }}:test-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Stage 3: 测试基础镜像（90 个工具全量验证）
  # ============================================================================
  test-base:
    needs: build-base
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "=== 清理前磁盘空间 ==="
          df -h
          echo ""
          echo "=== 删除不需要的软件 ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo docker image prune --all --force
          sudo apt-get clean
          echo ""
          echo "=== 清理后磁盘空间 ==="
          df -h

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Pull base image
        run: |
          docker pull --platform linux/${{ matrix.arch }} ${{ env.BASE_IMAGE }}:test-${{ github.sha }}-${{ matrix.arch }}
          docker tag ${{ env.BASE_IMAGE }}:test-${{ github.sha }}-${{ matrix.arch }} liusha-sandbox-base:test
          docker images

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${{ matrix.arch }}
          sudo chmod +x /usr/local/bin/yq

      - name: Test L1 - Command Existence (90 tools)
        run: |
          echo "=== Level 1: 命令存在性验证 ==="
          echo ""

          TOTAL=0
          PASSED=0
          FAILED=0
          FAILED_TOOLS=""

          # 读取 tools.yaml 中的所有工具
          TOOLS=$(yq eval '.tools[].name' internal/tools/manifest/tools.yaml)

          for tool in $TOOLS; do
            TOTAL=$((TOTAL + 1))

            # 测试命令存在性
            if docker run --rm liusha-sandbox-base:test bash -c "command -v $tool" >/dev/null 2>&1; then
              echo "✅ $tool"
              PASSED=$((PASSED + 1))
            else
              echo "❌ $tool - NOT FOUND"
              FAILED=$((FAILED + 1))
              FAILED_TOOLS="$FAILED_TOOLS $tool"
            fi
          done

          echo ""
          echo "=== Level 1 Summary ==="
          echo "Total:   $TOTAL"
          echo "Passed:  $PASSED"
          echo "Failed:  $FAILED"

          if [ $FAILED -gt 0 ]; then
            echo ""
            echo "❌ Missing tools:$FAILED_TOOLS"
            exit 1
          fi

      - name: Test L2 - Version Output (90 tools)
        run: |
          echo "=== Level 2: 版本输出验证 ==="
          echo ""

          TOTAL=0
          PASSED=0
          FAILED=0
          FAILED_TOOLS=""

          # 读取 tools.yaml 中的所有工具
          TOOLS=$(yq eval '.tools[].name' internal/tools/manifest/tools.yaml)

          for tool in $TOOLS; do
            TOTAL=$((TOTAL + 1))

            # 测试版本输出（尝试 --version 或 --help）
            if docker run --rm liusha-sandbox-base:test bash -c "$tool --version 2>&1 | head -5" 2>/dev/null | grep -qE '.'; then
              echo "✅ $tool --version"
              PASSED=$((PASSED + 1))
            elif docker run --rm liusha-sandbox-base:test bash -c "$tool --help 2>&1 | head -5" 2>/dev/null | grep -qE '.'; then
              echo "✅ $tool --help"
              PASSED=$((PASSED + 1))
            elif docker run --rm liusha-sandbox-base:test bash -c "$tool -h 2>&1 | head -5" 2>/dev/null | grep -qE '.'; then
              echo "✅ $tool -h"
              PASSED=$((PASSED + 1))
            else
              echo "❌ $tool - NO VERSION OUTPUT"
              FAILED=$((FAILED + 1))
              FAILED_TOOLS="$FAILED_TOOLS $tool"
            fi
          done

          echo ""
          echo "=== Level 2 Summary ==="
          echo "Total:   $TOTAL"
          echo "Passed:  $PASSED"
          echo "Failed:  $FAILED"

          if [ $FAILED -gt 0 ]; then
            echo ""
            echo "❌ Tools with no output:$FAILED_TOOLS"
            exit 1
          fi

  # ============================================================================
  # Stage 4: 推送基础镜像（重新 tag 为 latest）
  # ============================================================================
  push-base:
    needs: test-base
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Merge arch manifests into latest (registry-side, no pull)
        run: |
          # 使用 buildx imagetools 在 registry 层面合并双架构 manifest list，无需下载镜像
          docker buildx imagetools create \
            --tag ${{ env.BASE_IMAGE }}:latest \
            --tag ${{ env.BASE_IMAGE }}:${{ github.sha }} \
            ${{ env.BASE_IMAGE }}:test-${{ github.sha }}-amd64 \
            ${{ env.BASE_IMAGE }}:test-${{ github.sha }}-arm64

      - name: Verify pushed base image
        run: |
          echo "=== 验证刚推送的 latest tag ==="
          BASE_IMAGE_LATEST="${{ env.BASE_IMAGE }}:latest"

          # 等待 registry 同步
          sleep 5

          # 检查 manifest（不 pull 镜像本身，8-10GB 太大）
          echo "检查 manifest..."
          if ! docker buildx imagetools inspect ${BASE_IMAGE_LATEST}; then
            echo "❌ latest tag manifest 不存在"
            exit 1
          fi

          echo "✅ Base 镜像 manifest 验证通过"
          echo "注意：未 pull 完整镜像（8-10GB），只验证了 manifest 存在"


  # ============================================================================
  # build-final: 基于 freshly-built base 构建 final 镜像并推 GHCR，标签为提交 sha 与 :main；
  # 版本号与 latest 由发版（release-images）把源码一致的 sha 镜像晋升而来。
  # ============================================================================
  build-final:
    # 同时依赖 check（门）与 push-base（base 链）。always()：仅 final 内容变更
    # 时 base 链整体跳过，final 仍要构建（基于已发布的 base:latest）；base
    # 变更时 push-base 已完成，latest 是新鲜的——两种路径时序都正确。
    needs: [check-changed, push-base]
    if: always() && needs.check-changed.outputs.should_build_final == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # base 已是双架构 manifest list，final 是薄层（交叉编译的 Go 二进制 + 脚本
    # COPY），buildx 双平台构建在 amd64 runner 上即可完成（无重编译面）。
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push final image (sandbox-server + browser-use + uvx wrapper)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/tool-images/sandbox/Dockerfile.final
          # Go 段在 Dockerfile 里按 $BUILDPLATFORM 交叉编译，final 的 RUN 层是
          # 纯 shell 胶水——amd64 runner 双平台直推，无需 QEMU 重编译。
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}:latest
          push: true
          tags: |
            ${{ env.FINAL_IMAGE }}:test-${{ github.sha }}

      - name: Smoke test final image
        run: |
          docker pull --platform linux/amd64 ${{ env.FINAL_IMAGE }}:test-${{ github.sha }}
          docker run --rm \
            ${{ env.FINAL_IMAGE }}:test-${{ github.sha }} \
            bash -c '
              set -e
              echo "=== uvx wrapper ==="
              # uv tool run 不支持 --version——校验 wrapper 存在且转发语义正确（离线安全）
              command -v uvx >/dev/null && grep -q "uv tool run" /usr/local/bin/uvx && echo "uvx OK"
              echo "=== chromium（base 预装）==="
              ls ~/.cache/ms-playwright/chromium*-*/chrome-linux/chrome >/dev/null 2>&1 || ls ~/.cache/ms-playwright/chromium*/**/chrome >/dev/null 2>&1 && echo "chromium OK"
              echo "=== sandbox-server ==="
              test -x /usr/local/bin/sandbox-server && echo "sandbox-server OK"
              echo "=== 90 工具抽查 ==="
              for tool in nmap sqlmap curl ffuf feroxbuster nuclei; do
                command -v $tool >/dev/null || { echo "缺 $tool"; exit 1; }
              done
              echo "6/6 spot-check OK"
            '

      - name: Push final image (merge arch manifests)
        run: |
          # 双平台已由 build-push-action 直推为单一 multi-arch tag；这里以它为源落 sha 与
          # main 标签。sha 标签是发版的依据：release-images 按沙盒源码找出对应提交的镜像
          # 晋升为 X.Y.Z / X.Y / latest（与业务镜像同版本号）；main 只是「main 上最新一次
          # 构建」的便捷标签，发版不读它。不动 latest：latest 只随正式版移动。
          docker buildx imagetools create \
            --tag ${{ env.FINAL_IMAGE }}:main \
            --tag ${{ env.FINAL_IMAGE }}:${{ github.sha }} \
            ${{ env.FINAL_IMAGE }}:test-${{ github.sha }}

      - name: Verify pushed final image
        run: |
          sleep 5
          docker buildx imagetools inspect ${{ env.FINAL_IMAGE }}:${{ github.sha }}
          echo "✅ final 镜像已发布: ${{ env.FINAL_IMAGE }}:${{ github.sha }}（及 :main）"


  # 
  # Final 镜像构建方式：
  # 
  # 1. CI 自动构建并推送 base 镜像到 GHCR
  # 2. 本地拉取 base 并构建 final（不推送）：
  # 
  #    docker pull ghcr.io/v3teran/liusha-sandbox-base:latest
  #    
  #    docker buildx build --platform linux/amd64 \
  #      --build-arg BASE_IMAGE=ghcr.io/v3teran/liusha-sandbox-base:latest \
  #      -t sandbox:local \
  #      -f deployments/tool-images/sandbox/Dockerfile.final .
  # 
  # 3. 本地使用：
  # 
  #    docker run --rm ghcr.io/v3teran/liusha-sandbox:latest echo "Success"
  # 
  # ============================================================================
