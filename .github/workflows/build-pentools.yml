name: Build and Test Pentools Images

on:
  push:
    branches: [main]
    paths:
      - 'deployments/tool-images/pentools/**'
      - 'cmd/sandbox-server/**'
      - 'internal/sandbox/**'
      - '.github/workflows/build-pentools.yml'
  workflow_dispatch:
    inputs:
      rebuild_base:
        description: '强制重建基础镜像'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  BASE_IMAGE: ghcr.io/v3teran/pentools-base
  FINAL_IMAGE: ghcr.io/v3teran/liusha-pentools

jobs:
  # ============================================================================
  # Stage 1: 检查是否需要重建基础镜像
  # ============================================================================
  check-base-changed:
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if base files changed
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.rebuild_base }}" = "true" ]; then
            echo "手动触发重建基础镜像"
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 检查 Dockerfile.base 或 tools.yaml 是否变更
          if git diff --name-only HEAD^ HEAD | grep -E "Dockerfile\.base|tools\.yaml"; then
            echo "基础镜像文件已变更，需要重建"
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "基础镜像文件未变更，跳过重建"
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # Stage 2: 构建并推送基础镜像（直接推送，不保存 artifact）
  # ============================================================================
  build-base:
    needs: check-base-changed
    if: needs.check-base-changed.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "=== 清理前磁盘空间 ==="
          df -h
          echo ""
          echo "=== 删除不需要的软件 ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo docker image prune --all --force
          sudo apt-get clean
          echo ""
          echo "=== 清理后磁盘空间 ==="
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/tool-images/pentools/Dockerfile.base
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BASE_IMAGE }}:test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Stage 3: 测试基础镜像（90 个工具全量验证）
  # ============================================================================
  test-base:
    needs: build-base
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "=== 清理前磁盘空间 ==="
          df -h
          echo ""
          echo "=== 删除不需要的软件 ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo docker image prune --all --force
          sudo apt-get clean
          echo ""
          echo "=== 清理后磁盘空间 ==="
          df -h

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull base image
        run: |
          docker pull ${{ env.BASE_IMAGE }}:test-${{ github.sha }}
          docker tag ${{ env.BASE_IMAGE }}:test-${{ github.sha }} pentools-base:test
          docker images

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Test L1 - Command Existence (90 tools)
        run: |
          echo "=== Level 1: 命令存在性验证 ==="
          echo ""

          TOTAL=0
          PASSED=0
          FAILED=0
          FAILED_TOOLS=""

          # 读取 tools.yaml 中的所有工具
          TOOLS=$(yq eval '.tools[].name' deployments/tool-images/pentools/tools.yaml)

          for tool in $TOOLS; do
            TOTAL=$((TOTAL + 1))

            # 测试命令存在性
            if docker run --rm pentools-base:test bash -c "command -v $tool" >/dev/null 2>&1; then
              echo "✅ $tool"
              PASSED=$((PASSED + 1))
            else
              echo "❌ $tool - NOT FOUND"
              FAILED=$((FAILED + 1))
              FAILED_TOOLS="$FAILED_TOOLS $tool"
            fi
          done

          echo ""
          echo "=== Level 1 Summary ==="
          echo "Total:   $TOTAL"
          echo "Passed:  $PASSED"
          echo "Failed:  $FAILED"

          if [ $FAILED -gt 0 ]; then
            echo ""
            echo "❌ Missing tools:$FAILED_TOOLS"
            exit 1
          fi

      - name: Test L2 - Version Output (90 tools)
        run: |
          echo "=== Level 2: 版本输出验证 ==="
          echo ""

          TOTAL=0
          PASSED=0
          FAILED=0
          FAILED_TOOLS=""

          # 读取 tools.yaml 中的所有工具
          TOOLS=$(yq eval '.tools[].name' deployments/tool-images/pentools/tools.yaml)

          for tool in $TOOLS; do
            TOTAL=$((TOTAL + 1))

            # 测试版本输出（尝试 --version 或 --help）
            if docker run --rm pentools-base:test bash -c "$tool --version 2>&1 | head -5" 2>/dev/null | grep -qE '.'; then
              echo "✅ $tool --version"
              PASSED=$((PASSED + 1))
            elif docker run --rm pentools-base:test bash -c "$tool --help 2>&1 | head -5" 2>/dev/null | grep -qE '.'; then
              echo "✅ $tool --help"
              PASSED=$((PASSED + 1))
            elif docker run --rm pentools-base:test bash -c "$tool -h 2>&1 | head -5" 2>/dev/null | grep -qE '.'; then
              echo "✅ $tool -h"
              PASSED=$((PASSED + 1))
            else
              echo "❌ $tool - NO VERSION OUTPUT"
              FAILED=$((FAILED + 1))
              FAILED_TOOLS="$FAILED_TOOLS $tool"
            fi
          done

          echo ""
          echo "=== Level 2 Summary ==="
          echo "Total:   $TOTAL"
          echo "Passed:  $PASSED"
          echo "Failed:  $FAILED"

          if [ $FAILED -gt 0 ]; then
            echo ""
            echo "❌ Tools with no output:$FAILED_TOOLS"
            exit 1
          fi

  # ============================================================================
  # Stage 4: 推送基础镜像（重新 tag 为 latest）
  # ============================================================================
  push-base:
    needs: test-base
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag base image (registry-side, no pull)
        run: |
          # 使用 buildx imagetools 在 registry 层面操作，无需下载镜像
          docker buildx imagetools create \
            --tag ${{ env.BASE_IMAGE }}:latest \
            --tag ${{ env.BASE_IMAGE }}:${{ github.sha }} \
            ${{ env.BASE_IMAGE }}:test-${{ github.sha }}

      - name: Verify pushed base image
        run: |
          echo "=== 验证刚推送的 latest tag ==="
          BASE_IMAGE_LATEST="${{ env.BASE_IMAGE }}:latest"

          # 等待 registry 同步
          sleep 5

          # 检查 manifest（不 pull 镜像本身，8-10GB 太大）
          echo "检查 manifest..."
          if ! docker buildx imagetools inspect ${BASE_IMAGE_LATEST}; then
            echo "❌ latest tag manifest 不存在"
            exit 1
          fi

          echo "✅ Base 镜像 manifest 验证通过"
          echo "注意：未 pull 完整镜像（8-10GB），只验证了 manifest 存在"


  # ============================================================================
  # build-final: 基于 freshly-built base 构建 final 镜像并推 GHCR
  # （2026-10-03 恢复：官方 liusha-pentools:latest 与 base 同步发布，服务器部署
  #   可直接 pull；本地同名 tag 优先命中不影响 dev 流程）
  # ============================================================================
  build-final:
    needs: push-base
    if: needs.check-base-changed.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build final image (sandbox-server + browser-use + uvx wrapper)
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg BASE_IMAGE=${{ env.BASE_IMAGE }}:latest \
            -f deployments/tool-images/pentools/Dockerfile.final \
            -t ${{ env.FINAL_IMAGE }}:test-${{ github.sha }} \
            .

      - name: Smoke test final image
        run: |
          docker run --rm --platform linux/amd64 \
            ${{ env.FINAL_IMAGE }}:test-${{ github.sha }} \
            bash -c '
              set -e
              echo "=== uvx wrapper ==="
              # uv tool run 不支持 --version——校验 wrapper 存在且转发语义正确（离线安全）
              command -v uvx >/dev/null && grep -q "uv tool run" /usr/local/bin/uvx && echo "uvx OK"
              echo "=== chromium（base 预装）==="
              ls ~/.cache/ms-playwright/chromium*-*/chrome-linux/chrome >/dev/null 2>&1 || ls ~/.cache/ms-playwright/chromium*/**/chrome >/dev/null 2>&1 && echo "chromium OK"
              echo "=== sandbox-server ==="
              test -x /usr/local/bin/sandbox-server && echo "sandbox-server OK"
              echo "=== 90 工具抽查 ==="
              for tool in nmap sqlmap curl ffuf feroxbuster nuclei; do
                command -v $tool >/dev/null || { echo "缺 $tool"; exit 1; }
              done
              echo "6/6 spot-check OK"
            '

      - name: Push final image
        run: |
          docker buildx imagetools create \
            --tag ${{ env.FINAL_IMAGE }}:latest \
            --tag ${{ env.FINAL_IMAGE }}:${{ github.sha }} \
            ${{ env.FINAL_IMAGE }}:test-${{ github.sha }}

      - name: Verify pushed final image
        run: |
          sleep 5
          docker buildx imagetools inspect ${{ env.FINAL_IMAGE }}:latest
          echo "✅ final 镜像已发布: ${{ env.FINAL_IMAGE }}:latest"


  # 
  # Final 镜像构建方式：
  # 
  # 1. CI 自动构建并推送 base 镜像到 GHCR
  # 2. 本地拉取 base 并构建 final（不推送）：
  # 
  #    docker pull ghcr.io/v3teran/pentools-base:latest
  #    
  #    docker buildx build --platform linux/amd64 \
  #      --build-arg BASE_IMAGE=ghcr.io/v3teran/pentools-base:latest \
  #      -t pentools:local \
  #      -f deployments/tool-images/pentools/Dockerfile.final .
  # 
  # 3. 本地使用：
  # 
  #    docker run --rm ghcr.io/v3teran/liusha-pentools:latest echo "Success"
  # 
  # ============================================================================
