name: Build and Test Pentools Images

on:
  push:
    branches: [main]
    paths:
      - 'deployments/tool-images/pentools/**'
      - 'cmd/sandbox-server/**'
      - 'internal/sandbox/**'
      - '.github/workflows/build-pentools.yml'
  workflow_dispatch:
    inputs:
      rebuild_base:
        description: '强制重建基础镜像'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  BASE_IMAGE: ghcr.io/v3teran/pentools-base
  FINAL_IMAGE: ghcr.io/v3teran/pentools

jobs:
  # ============================================================================
  # Stage 1: 检查是否需要重建基础镜像
  # ============================================================================
  check-base-changed:
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if base files changed
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.rebuild_base }}" = "true" ]; then
            echo "手动触发重建基础镜像"
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 检查 Dockerfile.base 或 tools.yaml 是否变更
          if git diff --name-only HEAD^ HEAD | grep -E "Dockerfile\.base|tools\.yaml"; then
            echo "基础镜像文件已变更，需要重建"
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "基础镜像文件未变更，跳过重建"
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # Stage 2: 构建并推送基础镜像（直接推送，不保存 artifact）
  # ============================================================================
  build-base:
    needs: check-base-changed
    if: needs.check-base-changed.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "=== 清理前磁盘空间 ==="
          df -h
          echo ""
          echo "=== 删除不需要的软件 ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo docker image prune --all --force
          sudo apt-get clean
          echo ""
          echo "=== 清理后磁盘空间 ==="
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/tool-images/pentools/Dockerfile.base
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BASE_IMAGE }}:test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Stage 3: 测试基础镜像（90 个工具全量验证）
  # ============================================================================
  test-base:
    needs: build-base
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "=== 清理前磁盘空间 ==="
          df -h
          echo ""
          echo "=== 删除不需要的软件 ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo docker image prune --all --force
          sudo apt-get clean
          echo ""
          echo "=== 清理后磁盘空间 ==="
          df -h

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull base image
        run: |
          docker pull ${{ env.BASE_IMAGE }}:test-${{ github.sha }}
          docker tag ${{ env.BASE_IMAGE }}:test-${{ github.sha }} pentools-base:test
          docker images

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Test L1 - Command Existence (90 tools)
        run: |
          echo "=== Level 1: 命令存在性验证 ==="
          echo ""

          TOTAL=0
          PASSED=0
          FAILED=0
          FAILED_TOOLS=""

          # 读取 tools.yaml 中的所有工具
          TOOLS=$(yq eval '.tools[].name' deployments/tool-images/pentools/tools.yaml)

          for tool in $TOOLS; do
            TOTAL=$((TOTAL + 1))

            # 测试命令存在性
            if docker run --rm pentools-base:test bash -c "command -v $tool" >/dev/null 2>&1; then
              echo "✅ $tool"
              PASSED=$((PASSED + 1))
            else
              echo "❌ $tool - NOT FOUND"
              FAILED=$((FAILED + 1))
              FAILED_TOOLS="$FAILED_TOOLS $tool"
            fi
          done

          echo ""
          echo "=== Level 1 Summary ==="
          echo "Total:   $TOTAL"
          echo "Passed:  $PASSED"
          echo "Failed:  $FAILED"

          if [ $FAILED -gt 0 ]; then
            echo ""
            echo "❌ Missing tools:$FAILED_TOOLS"
            exit 1
          fi

      - name: Test L2 - Version Output (90 tools)
        run: |
          echo "=== Level 2: 版本输出验证 ==="
          echo ""

          TOTAL=0
          PASSED=0
          FAILED=0
          FAILED_TOOLS=""

          # 读取 tools.yaml 中的所有工具
          TOOLS=$(yq eval '.tools[].name' deployments/tool-images/pentools/tools.yaml)

          for tool in $TOOLS; do
            TOTAL=$((TOTAL + 1))

            # 测试版本输出（尝试 --version 或 --help）
            if docker run --rm pentools-base:test bash -c "$tool --version 2>&1 | head -5" 2>/dev/null | grep -qE '.'; then
              echo "✅ $tool --version"
              PASSED=$((PASSED + 1))
            elif docker run --rm pentools-base:test bash -c "$tool --help 2>&1 | head -5" 2>/dev/null | grep -qE '.'; then
              echo "✅ $tool --help"
              PASSED=$((PASSED + 1))
            elif docker run --rm pentools-base:test bash -c "$tool -h 2>&1 | head -5" 2>/dev/null | grep -qE '.'; then
              echo "✅ $tool -h"
              PASSED=$((PASSED + 1))
            else
              echo "❌ $tool - NO VERSION OUTPUT"
              FAILED=$((FAILED + 1))
              FAILED_TOOLS="$FAILED_TOOLS $tool"
            fi
          done

          echo ""
          echo "=== Level 2 Summary ==="
          echo "Total:   $TOTAL"
          echo "Passed:  $PASSED"
          echo "Failed:  $FAILED"

          if [ $FAILED -gt 0 ]; then
            echo ""
            echo "❌ Tools with no output:$FAILED_TOOLS"
            exit 1
          fi

  # ============================================================================
  # Stage 4: 推送基础镜像（重新 tag 为 latest）
  # ============================================================================
  push-base:
    needs: test-base
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag base image (registry-side, no pull)
        run: |
          # 使用 buildx imagetools 在 registry 层面操作，无需下载镜像
          docker buildx imagetools create \
            --tag ${{ env.BASE_IMAGE }}:latest \
            --tag ${{ env.BASE_IMAGE }}:${{ github.sha }} \
            ${{ env.BASE_IMAGE }}:test-${{ github.sha }}

      - name: Verify pushed base image
        run: |
          echo "=== 验证刚推送的 latest tag ==="
          BASE_IMAGE_LATEST="${{ env.BASE_IMAGE }}:latest"

          # 等待 registry 同步
          sleep 5

          # 检查 manifest（不 pull 镜像本身，8-10GB 太大）
          echo "检查 manifest..."
          if ! docker buildx imagetools inspect ${BASE_IMAGE_LATEST}; then
            echo "❌ latest tag manifest 不存在"
            exit 1
          fi

          echo "✅ Base 镜像 manifest 验证通过"
          echo "注意：未 pull 完整镜像（8-10GB），只验证了 manifest 存在"

  # ============================================================================
  # Stage 5: 构建最终镜像（不推送）
  # ============================================================================
  build-final:
    needs: [check-base-changed, push-base]
    if: always() && (needs.push-base.result == 'success' || needs.check-base-changed.outputs.should_build == 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine base image tag
        id: base-tag
        run: |
          if [ "${{ needs.check-base-changed.outputs.should_build }}" = "true" ]; then
            echo "使用新构建的 base 镜像: ${{ github.sha }}"
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "使用现有的 base 镜像: latest"
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Verify base image exists
        run: |
          BASE_TAG="${{ steps.base-tag.outputs.tag }}"
          BASE_IMAGE_FULL="${{ env.BASE_IMAGE }}:${BASE_TAG}"
          echo "验证镜像: ${BASE_IMAGE_FULL}"

          # 只检查 manifest（不 pull 8-10GB 的大镜像）
          echo "检查 manifest..."
          if docker buildx imagetools inspect ${BASE_IMAGE_FULL} > /tmp/inspect.log 2>&1; then
            echo "✅ Manifest 存在"
            cat /tmp/inspect.log
          else
            echo "❌ Manifest 不存在或无法访问"
            cat /tmp/inspect.log
            exit 1
          fi

          # 给 GHCR 更多时间完成后台同步（大镜像需要时间）
          echo ""
          echo "等待 GHCR 完成镜像层同步（30秒）..."
          sleep 30

      - name: Build final image (push to test tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/tool-images/pentools/Dockerfile.final
          platforms: linux/amd64
          push: true
          tags: ${{ env.FINAL_IMAGE }}:test-${{ github.sha }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}:${{ steps.base-tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        timeout-minutes: 15

  # ============================================================================
  # Stage 6: 测试最终镜像（sandbox-server + 工具继承）
  # ============================================================================
  test-final:
    needs: build-final
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "=== 清理前磁盘空间 ==="
          df -h
          echo ""
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo docker image prune --all --force
          sudo apt-get clean
          echo ""
          echo "=== 清理后磁盘空间 ==="
          df -h

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull final image
        run: |
          docker pull ${{ env.FINAL_IMAGE }}:test-${{ github.sha }}
          docker tag ${{ env.FINAL_IMAGE }}:test-${{ github.sha }} pentools:test
          docker images

      - name: Test sandbox-server startup
        run: |
          echo "=== 测试 sandbox-server 启动 ==="

          # 启动容器（后台运行）
          CONTAINER_ID=$(docker run -d -p 8080:8080 pentools:test)
          echo "容器 ID: $CONTAINER_ID"

          # 等待启动（最多 30 秒）
          echo "等待 sandbox-server 启动..."
          for i in {1..30}; do
            if curl -sf http://localhost:8080/healthz > /dev/null 2>&1; then
              echo "✅ sandbox-server 已启动"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ sandbox-server 启动超时"
              docker logs $CONTAINER_ID
              exit 1
            fi
            sleep 1
          done

          # 验证健康检查端点
          echo "验证健康检查端点..."
          RESPONSE=$(curl -s http://localhost:8080/healthz)
          echo "响应: $RESPONSE"

          if echo "$RESPONSE" | grep -qE "ok|healthy|running"; then
            echo "✅ 健康检查通过"
          else
            echo "❌ 健康检查失败"
            docker logs $CONTAINER_ID
            exit 1
          fi

          # 停止容器
          docker stop $CONTAINER_ID
          docker rm $CONTAINER_ID

      - name: Test browser-use script
        run: |
          echo "=== 测试 browser-use 脚本 ==="

          if docker run --rm pentools:test browser-use --help 2>&1 | grep -qE "usage|help|browser"; then
            echo "✅ browser-use 脚本可用"
          else
            echo "❌ browser-use 脚本失败"
            exit 1
          fi

      - name: Test tools inheritance (sampling)
        run: |
          echo "=== 测试工具继承（抽样验证）==="

          # 抽样测试 10 个关键工具
          TOOLS="nmap sqlmap nuclei httpx ffuf hydra john hashcat metasploit ysomap"

          for tool in $TOOLS; do
            if docker run --rm pentools:test bash -c "command -v $tool" >/dev/null 2>&1; then
              echo "✅ $tool"
            else
              echo "❌ $tool - NOT FOUND"
              exit 1
            fi
          done

          echo ""
          echo "✅✅✅ 工具继承验证通过！"

  # ============================================================================
  # Stage 7: 推送最终镜像
  # ============================================================================
  push-final:
    needs: test-final
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and retag final image
        run: |
          docker pull ${{ env.FINAL_IMAGE }}:test-${{ github.sha }}
          docker tag ${{ env.FINAL_IMAGE }}:test-${{ github.sha }} ${{ env.FINAL_IMAGE }}:latest
          docker tag ${{ env.FINAL_IMAGE }}:test-${{ github.sha }} ${{ env.FINAL_IMAGE }}:${{ github.sha }}
          docker push ${{ env.FINAL_IMAGE }}:latest
          docker push ${{ env.FINAL_IMAGE }}:${{ github.sha }}
