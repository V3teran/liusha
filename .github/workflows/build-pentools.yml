name: Build Pentools Images

on:
  push:
    branches: [main]
    paths:
      - 'deployments/tool-images/pentools/**'
      - 'scripts/build/install-from-manifest.sh'
      - '.github/workflows/build-pentools.yml'
  workflow_dispatch:
    inputs:
      rebuild_base:
        description: '是否强制重建基础镜像'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/pentools-base
  FINAL_IMAGE: ghcr.io/${{ github.repository_owner }}/pentools

jobs:
  # 检查是否需要重建基础镜像
  check-base-changed:
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if base files changed
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.rebuild_base }}" = "true" ]; then
            echo "手动触发重建基础镜像"
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 检查影响基础镜像的文件是否变更
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD || echo "all")

          if echo "$CHANGED_FILES" | grep -E "(tools.yaml|Dockerfile.base|install-from-manifest.sh)"; then
            echo "基础镜像相关文件已变更"
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "基础镜像无需重建"
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

  build-base:
    needs: check-base-changed
    if: needs.check-base-changed.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/tool-images/pentools/Dockerfile.base
          push: true
          tags: |
            ${{ env.BASE_IMAGE }}:latest
            ${{ env.BASE_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-final:
    needs: [check-base-changed, build-base]
    # 如果 build-base 跳过或成功，都继续构建最终镜像
    if: always() && (needs.build-base.result == 'success' || needs.build-base.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push final image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/tool-images/pentools/Dockerfile.final
          push: true
          tags: |
            ${{ env.FINAL_IMAGE }}:latest
            ${{ env.FINAL_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
