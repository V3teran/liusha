# 单镜像形态的前置 nginx：与 deployments/nginx/nginx.conf 同一套转发语义，
# 差别仅在 upstream——全家同容器，api 走 127.0.0.1 而非 compose 服务名。
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;

  gzip            on;
  gzip_vary       on;
  gzip_min_length 1024;
  gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

  upstream liusha_api {
    server 127.0.0.1:8090;
  }

  server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # SSE 流式端点：关缓冲 + 长超时（与 compose 形态的 nginx 配置一致）。
    location ~ ^/api/conversations/[^/]+/stream$ {
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass            http://liusha_api;
      proxy_http_version    1.1;
      proxy_set_header      Host              $host;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_set_header      Connection        "";
      proxy_buffering       off;
      proxy_cache           off;
      proxy_read_timeout    3600s;
      chunked_transfer_encoding off;
    }

    location /api/ {
      # 不带 URI 的 proxy_pass 原样保留 /api 前缀——后端路由挂在 /api 组（/api/tasks 等），
      # 剥前缀会 404（与 vite dev 代理一致；root 级 /healthz 不经 nginx 消费）。
      proxy_pass            http://liusha_api;
      proxy_http_version    1.1;
      proxy_set_header      Host              $host;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_read_timeout    120s;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }

    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }
}
