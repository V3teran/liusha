# liusha 沙箱预装工具清单（22 个）
#
# 单一来源：与同目录 Dockerfile 同步维护——
# Dockerfile 装的 binary 与本 yaml 列出的 tools 应严格对应（可加 CI lint 校对）。
#
# 用途：
#   - host 启动时读此文件 → 拼到 hunter SystemPrompt 的 tooling_catalog 段（Tier 1 索引）
#   - LLM 在每个 turn 都看到本清单，知道"沙箱有哪些工具可调"
#
# 工具的详细手册：skills/tooling/<name>/SKILL.md（Tier 2，按需 read_tooling_skill 拉）
# 工具是否有 SKILL.md 与是否在镜像里**独立**——SKILL 缺失只是没详细手册，工具仍然存在。
#
# category 取值与 hunter/skill.go 的 toolingCategoryOrder 保持一致；
# 未列入 toolingCategoryOrder 的 category 会落到"未分类"组提醒维护者。

tools:
  # ===== recon（侦察 — 资产/服务/技术栈发现）=====
  - name: subfinder
    category: recon
    description: 子域名被动枚举（多源 OSINT）。零接触目标，只查公网情报源（crt.sh/passive DNS）。
  - name: httpx
    category: recon
    description: HTTP 探活 + 指纹 + tech detection。subfinder 之后必跑过滤死域。
  - name: katana
    category: recon
    description: 现代 Web 爬虫——爬一个起点 url 拿全部站内链接 + JS 解析的 endpoint。
  - name: nmap
    category: recon
    description: 端口扫描 + 服务指纹 + NSE 脚本（半个漏扫器）。发现主端口外的高危服务用。
  - name: wafw00f
    category: recon
    description: WAF 指纹识别（CloudFlare/Akamai/AWS WAF/F5）——选 sqlmap --tamper / dalfox bypass 前先跑。

  # ===== discovery（内容/参数发现）=====
  - name: arjun
    category: discovery
    description: HTTP 隐藏参数发现——爆 25k+ 参数名 wordlist 找未文档化的参数（admin/debug/role 类）。
  - name: dirsearch
    category: discovery
    description: 智能目录/文件爆破——自带 11k+ 行 wordlist + 扩展名探测 + smart filter，目录爆破首选。
  - name: ffuf
    category: discovery
    description: 通用 web fuzzer——任意位置 FUZZ 占位符替换 wordlist。dirsearch 不擅长的复杂场景用 ffuf。

  # ===== vulnscan（自动化模板漏扫）=====
  - name: nuclei
    category: vulnscan
    description: 模板化漏扫引擎——业界事实标准。10k+ 模板覆盖 CVE/misconfig/exposure/dast。

  # ===== injection（注入类专项）=====
  - name: sqlmap
    category: injection
    description: |
      SQL 注入自动探测/利用。常见 web SQLi 首选；GraphQL/NoSQL 不归它管。
      **blind/time-based 必加限速**：`--time-sec=1 --stop=5 -D <db> -T <table>`，**绝不整库 dump**（盲注每数据点千次 HTTP 请求，无限速会卡 10+ 分钟）；
      单次 timeout 后**优先 pivot**（curl 手动 boolean fuzz 或直接 write_finding 不 dump）；仅当**确有新假设**（如换 tamper bypass WAF / 换 payload 模式）才换 flag 重试 sqlmap。原地无新假设地微调是死循环。
  - name: dalfox
    category: injection
    description: XSS 自动探测 + 利用（反射/存储/DOM）。Go 实现，业界 XSS 之于 sqlmap。

  # ===== deserialization（反序列化 payload 生成）=====
  - name: ysoserial
    category: deserialization
    description: Java 反序列化 payload 生成器——gadget chain + cmd → base64 payload。Java app + ObjectInputStream 必备。
  - name: phpggc
    category: deserialization
    description: PHP 反序列化 payload 生成器——Laravel/Symfony/Drupal/WordPress 框架向。

  # ===== auth（认证/凭证攻击）=====
  - name: hydra
    category: auth
    description: 弱口令爆破——支持 50+ 协议（http-form/http-basic/ssh/ftp/smb/mysql 等）。
  - name: jwt_tool
    category: auth
    description: JWT 攻击瑞士军刀——解码/伪造/None 算法/算法混淆/key confusion/弱 secret 暴破。
  - name: mysql
    category: auth
    description: MySQL/MariaDB CLI 客户端——拿到 DB 凭证后直接连库验证/dump（mysql -h <host> -P <port> -u <user> -p<pass> -e "..."）。Python 等价：import pymysql（已预装）。

  # ===== sast（源码静态分析）=====
  - name: semgrep
    category: sast
    description: 静态代码分析——找代码逻辑漏洞（SQLi/XSS sink、不安全反序列化）。目标暴露源码时秒杀黑盒。
  - name: trufflehog
    category: sast
    description: Secrets 扫描——源码 / git 历史 / 文件系统 / S3 bucket 找硬编码 API key / token / 凭证。

  # ===== utility（通用辅助：HTTP/JSON/脚本/OOB/Browser）=====
  - name: curl
    category: utility
    description: |
      原生 HTTP 客户端。所有漏洞验证的瑞士军刀，sqlmap/python3 之前先用 curl 探 baseline。
      Cookie 跨工具桥接：browser-use 浏览器 session 和 curl 是独立 cookie jar，
      要从浏览器拿登录态给 curl 用：先 `browser-use cookies get`，再用 `-b "name=value;..."`
      手拼 / 或转 Netscape cookies.txt（curl -b cookies.txt）。CSRF token 类 form 字段
      须先 `curl GET` 拿页面 → grep token 值 → POST 带上。
  - name: python3
    category: utility
    description: 自定义脚本兜底（GraphQL/NoSQL 注入、复杂登录链、并发 fuzz、二阶段 payload、自定义编码绕过）。
  - name: jq
    category: utility
    description: JSON 解析/提取/重构。配合 curl pipe 用，避免自己 grep JSON 跑偏。
  - name: interactsh-client
    category: utility
    description: OOB（Out-Of-Band）回调检测——拿 oast.fun 子域名作 callback 钩子。Blind SSRF/RCE/XXE/XSS 唯一通用挖法。
  - name: browser-use
    category: utility
    description: |
      无头 Chromium 浏览器自动化（CLI 包装 playwright，已预装）。子命令：
      open <url> / state（DOM 索引树）/ click <idx> / input <idx> <text> / type <text> /
      select <idx> <value> / scroll / back / keys / hover / dblclick / rightclick /
      eval <js>（页面 context 执行 JS 返回末值）/ extract（LLM 抽取数据）/
      python（执行 Playwright Python 代码，可访问 page/context/browser API）/
      screenshot <path> / cookies / wait / get / close。
      session 持久（同 sandbox 内多次调用共用浏览器状态），close 显式关闭。
      约定：screenshot 必须写到 $OUTPUT_DIR/xxx.png（沙箱只扫该目录把图作为附件回传给 LLM；
      写到 /tmp 等其它路径的图不会进 LLM 上下文）。chromium 首次 cold start 约 25-30s，
      第 1 个 browser-use 命令的 timeout_seconds 至少传 60，后续 session 复用 15s 够用。
      ⚠️ **多 task 并发用 browser 时优先用 browser-use-tab**（每 task 独立 tab 防互覆）；
      browser-use 本命令仅留给管理类操作（install/doctor/sessions/close）+ 单任务串行场景。
  - name: browser-use-tab
    category: utility
    description: |
      多 task 安全的 browser-use 封装——共享 chromium daemon（cookies / session 共享）+
      每 task 独立 tab（截图独立 / 浏览历史独立 / 父子并发 open 不互覆）。
      用法跟 browser-use 完全一样，把命令改成 `browser-use-tab <子命令> <参数>` 即可。
      内部：第 1 次 open 时 JS window.open 创建新 tab + 落盘 idx 到
      /tmp/browser-tab-${TASK_ID}.idx；后续每次先 switch 回本 task tab 再透传子命令。
      flock 串行化避免父子并发 switch+操作 race。
      **subtask swarm 场景必用**：父 active 任务 spawn 子任务后，父子都用 browser-use-tab
      → 共享登录 cookies（账号不顶掉）+ 截图各自独立。
      管理类子命令（install/doctor/sessions/close/python/tunnel/switch/close-tab）自动透传
      原 browser-use（不上锁，不切 tab）。
