# liusha 前置 nginx：/ → 前端 SPA（web/dist），/api/* → 反代 api 容器。
# 与 monorepo 部署配套：前端源码在仓库根 web/，构建产物由本目录 Dockerfile 多阶段编译。
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;

  # 静态资源压缩（SPA 首屏体积敏感）。
  gzip            on;
  gzip_vary       on;
  gzip_min_length 1024;
  gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

  # api 容器：compose 服务名解析到内网地址。
  upstream liusha_api {
    server api:8080;
  }

  server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── SSE 流式端点：必须关缓冲、长超时，否则实时消息会被憋到连接结束才吐出 ──
    # 覆盖 /api/conversations/:id/stream（EventSource 长连接）。
    location ~ ^/api/conversations/[^/]+/stream$ {
      # 正则 location 的 proxy_pass 不能带 URI，故手动剥 /api 前缀（对齐后端无前缀路由）。
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass            http://liusha_api;
      proxy_http_version    1.1;
      proxy_set_header      Host              $host;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_set_header      Connection        "";
      # SSE 关键三连：关缓冲 + 关分块缓冲 + 长读超时。
      proxy_buffering       off;
      proxy_cache           off;
      proxy_read_timeout    3600s;
      chunked_transfer_encoding off;
    }

    # ── 普通 API：反代到 api 容器，剥去 /api 前缀（与 vite dev proxy rewrite 对齐）──
    location /api/ {
      proxy_pass            http://liusha_api/;
      proxy_http_version    1.1;
      proxy_set_header      Host              $host;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;
      proxy_read_timeout    120s;
    }

    # ── SPA 静态资源 + history/hash 回退 ──
    # hash 路由本不需要 try_files 回退，但保留 index 回退以兼容未来切 history 模式。
    location / {
      try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可长期缓存。
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }
}
