# liusha 前置 nginx（compose 部署，官方镜像挂载本文件）：纯反向代理。
# 控制台前端与 API 都由 api 组件提供；nginx 只负责对外入口（需要 HTTPS 时在这里加证书）。
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # api 上游经变量 + Docker 内嵌 DNS 运行时解析：静态 upstream 只在 nginx 启动时解析一次，
  # api 容器重建换 IP 后仍打旧地址 → 502 直至 nginx 重启。
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;
    set $liusha_api api:8580;

    # 上传大小由 api 按配置（conversation.attachment_max_bytes）把关，nginx 不另设上限。
    client_max_body_size 0;

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";

    # 会话事件流（SSE 长连接）：关缓冲、长读超时，否则实时消息会被憋到连接结束才吐出。
    location ~ ^/api/conversations/[^/]+/stream$ {
      proxy_pass         http://$liusha_api;
      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 3600s;
    }

    location / {
      proxy_pass         http://$liusha_api;
      proxy_read_timeout 120s;
    }
  }
}
