# liusha v1 docker-compose
# 6 个 service：postgres / redis / api / nginx / proxy / runner（+ vulnapp e2e profile）
# 默认起 postgres/redis/api/nginx；用 --profile e2e 起完整栈（含 proxy + runner + vulnapp）。
# nginx 前置：/ → 前端 SPA，/api/* → api:8080（前端源码在仓库根 web/，同仓 monorepo）。
# proxy（cmd/proxy）：内嵌 proxify SDK 的 MITM + filter/dedup/aggregator + Asynq 生产者，监听 8888。
# runner（cmd/runner）：Asynq 消费者 + ReAct 引擎，监听 9090（healthz）。
# 业界最佳实践：proxy 与 worker 独立进程，故障隔离 + 独立扩缩。
# migrate 走 host 侧 Makefile（make migrate），不在 compose 里跑。

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: liusha-postgres
    environment:
      POSTGRES_USER: liusha
      POSTGRES_PASSWORD: liusha
      POSTGRES_DB: liusha
    ports:
      - "5432:5432"
    volumes:
      - liusha-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liusha -d liusha"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8
    container_name: liusha-redis
    ports:
      - "6379:6379"
    volumes:
      - liusha-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: liusha/api
    build:
      context: ..
      dockerfile: cmd/api/Dockerfile
    container_name: liusha-api
    environment:
      LIUSHA_POSTGRES_DSN: postgres://liusha:liusha@postgres:5432/liusha?sslmode=disable
      LIUSHA_REDIS_ADDR: redis:6379
      LIUSHA_API_ADDR: 0.0.0.0:8080
      LIUSHA_API_KEY: "${LIUSHA_API_KEY:-changeme-dev-key}"
      LIUSHA_ENV: development
      LIUSHA_LOG_LEVEL: info
      LIUSHA_CONFIG: /app/config/config.yaml
      # LLM provider key：只保留 XIAOMI_API_KEY (mimo)
      XIAOMI_API_KEY: "${XIAOMI_API_KEY:-}"
      LIUSHA_LLM_LIGHT_PROVIDER: "${LIUSHA_LLM_LIGHT_PROVIDER:-mimo}"
      LIUSHA_LLM_FALLBACK_PROVIDER: "${LIUSHA_LLM_FALLBACK_PROVIDER:-mimo}"
      LIUSHA_LLM_VISION_PROVIDER: "${LIUSHA_LLM_VISION_PROVIDER:-mimo}"
      # SSE stream cookie 签名密钥：cmd/api fail-fast 必需（空则启动崩溃）。dev 默认占位，prod 必须覆盖。
      LIUSHA_STREAM_COOKIE_SECRET: "${LIUSHA_STREAM_COOKIE_SECRET:-changeme-dev-stream-secret}"
      # LLM provider 密钥加密密钥：用于加密存储在数据库中的 API keys
      LIUSHA_LLM_KEY_SECRET: "${LIUSHA_LLM_KEY_SECRET:-changeme-dev-encryption-secret-must-be-32-chars}"
    volumes:
      - ../logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--header=X-API-Key: ${LIUSHA_API_KEY:-changeme-dev-key}", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  # nginx：前置反代 + 前端 SPA 托管。/ → web/dist（多阶段构建内嵌），/api/* → api:8080。
  # 前端源码在仓库根 web/，与后端同仓（monorepo）。SSE 端点在 nginx.conf 里单独关缓冲。
  nginx:
    image: liusha/nginx
    build:
      context: ..
      dockerfile: deployments/nginx/Dockerfile
    container_name: liusha-nginx
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 10s
      timeout: 3s
      retries: 3

  # cmd/proxy：内嵌 proxify SDK 的 MITM 代理 + filter/dedup/aggregator + Asynq 生产者
  proxy:
    image: liusha/proxy
    build:
      context: ..
      dockerfile: cmd/proxy/Dockerfile
    container_name: liusha-proxy
    environment:
      LIUSHA_POSTGRES_DSN: postgres://liusha:liusha@postgres:5432/liusha?sslmode=disable
      LIUSHA_REDIS_ADDR: redis:6379
      LIUSHA_CONFIG: /app/config/config.yaml
      LIUSHA_ENV: development
      LIUSHA_LOG_LEVEL: info
      LIUSHA_PROXY_LISTEN_ADDR: 0.0.0.0:8888
      LIUSHA_PROXY_CERT_DIR: /app/certs
      # LLM provider key：只保留 XIAOMI_API_KEY (mimo)
      XIAOMI_API_KEY: "${XIAOMI_API_KEY:-}"
      LIUSHA_LLM_LIGHT_PROVIDER: "${LIUSHA_LLM_LIGHT_PROVIDER:-mimo}"
      LIUSHA_LLM_FALLBACK_PROVIDER: "${LIUSHA_LLM_FALLBACK_PROVIDER:-mimo}"
      LIUSHA_LLM_VISION_PROVIDER: "${LIUSHA_LLM_VISION_PROVIDER:-mimo}"
    volumes:
      - liusha-proxy-certs:/app/certs
      - ../logs:/app/logs
    ports:
      - "8888:8888"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # proxy 纯 MITM，无 healthz HTTP——探 TCP 8888（mitm 口）是否在听。
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8888"]
      interval: 10s
      timeout: 3s
      retries: 3
    profiles:
      - proxy
      - e2e

  # runner：Asynq 消费者 + ReAct 引擎（不再装 mitm，已拆到 cmd/proxy）。
  # 启动前需设 LIUSHA_DEEPSEEK_API_KEY（默认 LLM provider 的 key）。
  runner:
    image: liusha/runner
    build:
      context: ..
      dockerfile: cmd/runner/Dockerfile
    container_name: liusha-runner
    environment:
      LIUSHA_POSTGRES_DSN: postgres://liusha:liusha@postgres:5432/liusha?sslmode=disable
      LIUSHA_REDIS_ADDR: redis:6379
      LIUSHA_CONFIG: /app/config/config.yaml
      LIUSHA_ENV: development
      LIUSHA_LOG_LEVEL: info
      # LLM provider api_key：只保留 XIAOMI_API_KEY (mimo)
      XIAOMI_API_KEY: "${XIAOMI_API_KEY:-}"
      # LLM 路由覆盖（全部使用 mimo）
      LIUSHA_LLM_LIGHT_PROVIDER: "${LIUSHA_LLM_LIGHT_PROVIDER:-mimo}"
      LIUSHA_LLM_FALLBACK_PROVIDER: "${LIUSHA_LLM_FALLBACK_PROVIDER:-mimo}"
      LIUSHA_LLM_VISION_PROVIDER: "${LIUSHA_LLM_VISION_PROVIDER:-mimo}"
      # LLM provider 密钥加密密钥：用于加密存储在数据库中的 API keys
      LIUSHA_LLM_KEY_SECRET: "${LIUSHA_LLM_KEY_SECRET:-changeme-dev-encryption-secret-must-be-32-chars}"
      # eino 迁移：默认走 eino ChatModelAgent 路径；=1 切回旧 react（渐进迁移期退路）
      LIUSHA_USE_REACT: "${LIUSHA_USE_REACT:-}"
    volumes:
      - ../logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    profiles:
      - agent
      - e2e

  # vulnapp：BAC e2e 靶机（plan 1 T31）。仅 e2e profile 启动。
  # hostname=vulnapp 让 proxy / runner 在同一 network 内通过名字解析。
  vulnapp:
    image: liusha/vulnapp
    build:
      context: ..
      dockerfile: cmd/vulnapp/Dockerfile
    container_name: liusha-vulnapp
    hostname: vulnapp
    volumes:
      - ../logs:/app/logs
    ports:
      - "8001:8001"
    profiles:
      - e2e

volumes:
  liusha-pg:
  liusha-redis:
  liusha-proxy-certs:
