services:
  postgres:
    # Use the newest pg tag pgvector publishes on build day (pg17 or newer).
    image: pgvector/pgvector:pg17
    container_name: liusha-postgres
    environment:
      POSTGRES_USER: liusha
      POSTGRES_PASSWORD: liusha
      POSTGRES_DB: liusha
    ports:
      - "5432:5432"
    volumes:
      - liusha-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liusha -d liusha"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # Use current latest major (redis:8 as of 2026; bump on build day if newer exists).
    image: redis:8
    container_name: liusha-redis
    ports:
      - "6379:6379"
    volumes:
      - liusha-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  asynqmon:
    image: hibiken/asynqmon:latest
    # asynqmon publishes amd64 only; run under emulation on arm64 hosts.
    platform: linux/amd64
    container_name: liusha-asynqmon
    command: ["--redis-addr=redis:6379"]
    ports:
      - "8081:8080"
    depends_on:
      redis:
        condition: service_healthy

  # api 服务：由 cmd/api/Dockerfile 构建，依赖 postgres/redis 健康后再启动。
  api:
    image: liusha/api
    build:
      context: ..
      dockerfile: cmd/api/Dockerfile
    container_name: liusha-api
    environment:
      LIUSHA_POSTGRES_DSN: postgres://liusha:liusha@postgres:5432/liusha?sslmode=disable
      LIUSHA_REDIS_ADDR: redis:6379
      LIUSHA_API_ADDR: 0.0.0.0:8080
      LIUSHA_ENV: development
      LIUSHA_LOG_LEVEL: info
      LIUSHA_CONFIG: /app/config/config.yaml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  # proxy 服务：采集指定 engagement 的 HTTP 流量并写入 Redis/Postgres。
  # 启动前需设置 LIUSHA_ENGAGEMENT_ID 为目标 engagement 的 UUID。
  proxy:
    image: liusha/proxy
    build:
      context: ..
      dockerfile: cmd/proxy/Dockerfile
    container_name: liusha-proxy
    environment:
      LIUSHA_POSTGRES_DSN: postgres://liusha:liusha@postgres:5432/liusha?sslmode=disable
      LIUSHA_REDIS_ADDR: redis:6379
      LIUSHA_CONFIG: /app/config/config.yaml
      LIUSHA_ENGAGEMENT_ID: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8888:8888"
    volumes:
      - liusha-proxy-flows:/data
    profiles:
      - proxy

  # vuln-tools：一次性沙箱镜像。agent-worker 每次工具调用新建 --rm 容器跑，跑完销毁。
  # 此处只负责构建 image，不作为长驻 service 启动，因此使用 build-only profile。
  vuln-tools:
    image: liusha/vuln-tools
    build:
      context: ..
      dockerfile: docker/vuln-tools/Dockerfile
    profiles:
      - build-only
    # 该 profile 永远不会被默认启动；跑 `docker compose --profile build-only build vuln-tools` 即可。

  # agent-worker：消费 Asynq 队列执行 ReAct 循环。
  # Plan 5 骨架：Sink=LoggingSink，不落 graph_node；仅日志 + metrics + healthz。
  # 启动前需设置 LIUSHA_DEEPSEEK_API_KEY（官方 DeepSeek 或 OneAPI/LiteLLM 网关 key）。
  agent-worker:
    image: liusha/agent-worker
    build:
      context: ..
      dockerfile: cmd/agent-worker/Dockerfile
    container_name: liusha-agent-worker
    environment:
      LIUSHA_POSTGRES_DSN: postgres://liusha:liusha@postgres:5432/liusha?sslmode=disable
      LIUSHA_REDIS_ADDR: redis:6379
      LIUSHA_CONFIG: /app/config/config.yaml
      LIUSHA_ENV: development
      LIUSHA_LOG_LEVEL: info
      LIUSHA_DEEPSEEK_API_KEY: "${LIUSHA_DEEPSEEK_API_KEY}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    profiles:
      - agent

volumes:
  liusha-pg:
  liusha-redis:
  liusha-proxy-flows:
