# ============================================================================
# Liusha v1 主配置
#   - 仅放非敏感、可入库的开关与默认值
#   - 所有 *_API_KEY 走 env，本文件不出现密钥
#   - env 用 LIUSHA_ 前缀，支持二级覆盖
#     例 LIUSHA_LLM_DEFAULT_PROVIDER 覆盖 llm.default_provider
# ============================================================================

api:
  read_timeout_seconds: 15
  write_timeout_seconds: 30

postgres:
  max_conns: 20
  min_conns: 2

# ---- LLM 多 provider 路由（黑客松借鉴：创新 11）----
# default_provider:  主 ReAct（sniffer / 子任务）共用，重模型
# light_provider:    Observer / Compaction / Distill 走的轻模型，省成本
# vision_provider:   v1.5 的 browser.screenshot 用，v1 仅作为备用主 LLM
# fallback_provider: 429/529 退避耗尽后切到，retry 中间件用
# routes:            按角色路由到 provider；未列角色用 default_provider
llm:
  default_provider: deepseek
  light_provider: anthropic_haiku
  vision_provider: anthropic
  fallback_provider: openai
  max_steps: 30                 # ReAct 单任务步数上限，被 Role.Budget 覆盖
  max_tokens_per_call: 4096
  # 注意：viper 用点 "." 作 yaml 嵌套分隔符，所以 route key 用下划线避免歧义。
  # v1.1 routes：orchestrator 主协调 + prober 子探针 + observer + distill + vision
  routes:
    orchestrator: default_provider
    prober:       default_provider
    observer:     light_provider
    distill:      light_provider
    vision:       vision_provider

# 每个 provider 一节；只填要用的，其它留空即可
# api_key_env 是从 env 读 key 的变量名
providers:
  # type: openai_compat → sashabaranov/go-openai 调 /v1/chat/completions
  # type: anthropic     → anthropics/anthropic-sdk-go 调 /v1/messages
  deepseek:
    type: openai_compat
    base_url: https://api.deepseek.com/v1
    default_model: deepseek-chat
    api_key_env: DEEPSEEK_API_KEY
    max_tokens: 4096
    supports_tools: true
    supports_vision: false

  anthropic:
    type: anthropic
    base_url: https://api.anthropic.com
    default_model: claude-sonnet-4-6
    vision_model: claude-haiku-4-5
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 8192
    supports_tools: true
    supports_vision: true

  anthropic_haiku:
    type: anthropic
    base_url: https://api.anthropic.com
    default_model: claude-haiku-4-5
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 4096
    supports_tools: true
    supports_vision: true

  openai:
    type: openai_compat
    base_url: https://api.openai.com/v1
    default_model: gpt-4o
    api_key_env: OPENAI_API_KEY
    max_tokens: 4096
    supports_tools: true
    supports_vision: true

  moonshot:
    type: openai_compat
    base_url: https://api.moonshot.cn/v1
    default_model: kimi-k2-0905-preview
    api_key_env: MOONSHOT_API_KEY
    max_tokens: 4096
    supports_tools: true
    supports_vision: false

  qwen:
    type: openai_compat
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    default_model: qwen3-max
    api_key_env: QWEN_API_KEY
    max_tokens: 4096
    supports_tools: true
    supports_vision: false

# ---- proxy 内嵌 MITM + 责任链过滤 + 聚合参数 ----
# proxify SDK 内嵌到 host 进程；filter/aggregator 由 liusha 自己控
proxy:
  window_batch: 20              # TrafficWindow 批大小上限（满即关闭 → 立即触发 sniffer）
  window_max_age_seconds: 30    # ager 兜底：超过此秒数仍 open 的窗口会被强制关闭并入队 sniffer（低流量场景）
  allow_hosts:                  # HostFilter 白名单（空=放行全部；支持 *.example.com 前缀通配 + 其裸根域）
    - vulnapp                   # v1 e2e 靶机（docker 模式）
    - host.docker.internal      # 容器内 scanner → host vulnapp（docker 模式）
    - localhost                 # host 模式（cmd/proxy host 进程时直连 vulnapp）
    - 127.0.0.1                 # host 模式 IP 直连
  exclude_methods:              # HTTP 方法黑名单
    - OPTIONS
    - HEAD
    - CONNECT
  exclude_hosts: []             # Host 黑名单（支持 *.example.com，黑名单优先于白名单）
  exclude_upgrade_protocols:    # Upgrade 协议黑名单（空时仍兜底拦 websocket）
    - websocket
  exclude_suffixes:             # 静态资源后缀黑名单（大小写不敏感）
    - .css
    - .js
    - .png
    - .jpg
    - .gif
    - .ico
    - .woff
    - .woff2
  exclude_content_types: []     # Content-Type 黑名单（支持 image/* 通配；大小写不敏感）
  exclude_status_codes: []      # 状态码黑名单（命中即拒；空=放行全部状态码）
  max_request_body_size: 1048576   # 1 MiB
  max_response_body_size: 2097152  # 2 MiB

# ---- engagement 懒创建 + 24h 归档 ----
engagement:
  idle_timeout_hours: 24
  sweeper_interval_seconds: 600

# ---- skills 外部目录 ----
skills:
  root: ./skills
