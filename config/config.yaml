# ============================================================================
# Liusha 主配置：进程启动期参数（改后需重启进程）
#   - 运行期可热改的旋钮（工具超时、输出尾部保留、上下文压缩占比、代理过滤规则等）：
#     本文件给出部署默认（runner.step_llm_timeout_seconds、proxy 过滤字段），前端「系统配置」页
#     的自定义叠加其上；未被自定义的旋钮跟随本文件，改后重启生效
#   - 仅放非敏感、可入库的开关与默认值
#   - 所有 *_API_KEY 走 env，本文件不出现密钥
#   - env 用 LIUSHA_ 前缀，支持二级覆盖
#   - 任一字段缺省时 config.ApplyDefaults() 自动兜底，不会拒启动
# ============================================================================

# ---- cmd/api HTTP 入口 ----
api:
  read_timeout_seconds: 15
  write_timeout_seconds: 30
  read_header_timeout_seconds: 5         # runner HTTP（healthz + 沙盒抓流 ingest）的请求头读取超时
  listen_addr: 0.0.0.0:8580
  shutdown_timeout_seconds: 5

# ---- pgxpool 连接参数 ----
postgres:
  max_conns: 20
  min_conns: 2
  connect_timeout_seconds: 5
  max_conn_lifetime_seconds: 3600

# ---- go-redis client pool 参数 ----
# addr 仍由 ENV LIUSHA_REDIS_ADDR 提供（运维敏感）。
# 字段为 0 时透传 go-redis SDK 默认值（PoolSize=10×GOMAXPROCS / DialTimeout=5s /
# ReadTimeout=3s / WriteTimeout=3s）；多服务共享 redis 时按需调小 PoolSize 防 fd 爆。
redis:
  # 鉴权密码（与 redis-server requirepass 配对；部署侧经 ENV LIUSHA_REDIS_PASSWORD /
  # REDIS_PASSWORD 注入，此处保持空——空 = 无密码，开发形态零摩擦）
  password: ""
  pool_size: 0                             # 0 = SDK 默认（10 × GOMAXPROCS）
  min_idle_conns: 0
  dial_timeout_seconds: 0                  # 0 = SDK 默认 5
  read_timeout_seconds: 0                  # 0 = SDK 默认 3
  write_timeout_seconds: 0                 # 0 = SDK 默认 3

# ---- LLM 能力路由 ----
# 事实源是 DB（前端「LLM 配置」页），本段仅供空库首次种子导入（insert-only，见
# internal/config/seed/llm.go），DB 已有数据后不再生效。
#
# 复杂度路由：调用方 → complexity 档 → provider。
#   · agent → 档 的绑定在 agent 配置的 complexity（出厂值随程序发布，前端「智能体」页可自定义）；
#     api 侧的意图分类 / 会话标题 / 问答（inspector）→ simple；上下文压缩 → medium（代码内归档）。
#   · 档 → provider 的绑定落 DB（前端「LLM 配置」页「能力路由」），此处仅首次种子；
#     缺档由运行期就近降级到相邻档。
# 默认预设全路径 GLM；换/加厂商：复制一块 providers 注释模板改 3 个字段
# （type/base_url/default_model），.env 放该块 api_key_env 对应的 key，
# 再把需要的档位路由改指新块名。可多块并存、多把 key 分档使用。
llm:
  complexity_routes:
    simple:  glm   # 快速响应，简单任务（信息提取、格式化）
    medium:  glm   # 标准推理，常规任务（漏洞检测、工具调用）- 默认档位
    complex: glm   # 深度推理，复杂决策（战略规划、多步分析、多模态）

  # 错误码退避表（429/529/5xx/网络超时），api/runner/corpus-import 三进程共用同一表。
  # 429 取长尾：账号级限流的恢复窗口以十秒计；每次退避施加等量抖动（[d/2, d)），
  # 并发 Agent 的重试在时间窗内错峰。零值字段由代码默认表逐项兜底。
  retry:
    max_429: 4                          # 429 限流重试次数
    max_529: 1                          # 529 服务忙重试次数
    max_5xx: 2                          # 5xx 服务端错重试次数
    max_net: 2                          # 网络超时重试次数
    backoff_429_seconds: [2, 8, 30, 60] # 429 长尾退避（秒）
    backoff_5xx_seconds: [1, 4]
    backoff_net_seconds: [1, 3]
    backoff_529_ms: 0                   # 529 立即重试

  # llm_invocation 异步 batch 写入：Generate 路径 0 阻塞
  invocation:
    buffer_size: 1024                # channel 缓冲；满则丢一行（warn）
    batch_size: 100                  # 累积此行数即触发 flush
    flush_interval_ms: 1000          # 兜底 flush 周期
    insert_timeout_sec: 5            # 单次 batch insert 超时
    retention_days: 0                # 留存天数（记录含完整 prompt/response 敏感载荷）；0 = 永久留存

# 仅供空库首次种子导入（insert-only，见上方 llm: 段说明）；DB 是事实源，改模型走前端「LLM 配置」页。
# providers: 接入哪些大模型服务、用什么 key、哪个模型——在这里声明。
# 可声明多个块；llm.complexity_routes 把任务档位（simple/medium/complex）指到块名。
# 每块字段（只认协议，官方、各家兼容端点、中转网关都按所用协议接入）：
#   type          协议：openai_compat（Chat Completions）或 anthropic（Messages）
#   base_url      服务地址：openai_compat 含版本段（…/v1），anthropic 不含 /v1；
#                 误粘完整端点（…/chat/completions、…/v1/messages）会按协议自动归一
#   default_model 模型名，向服务方照抄
#   api_key_env   密钥的环境变量名（名字自取）；.env 放同名条目。值为空的块不导入（可启动，后到前端补）
#   auth_scheme   可选，密钥携带方式：bearer 或 x-api-key；缺省取协议标准方式
#                 （openai_compat → bearer，anthropic → x-api-key），网关只认另一种时显式填写
#   output_limit_param 可选，openai_compat 声明输出上限的字段：max_tokens（缺省）或
#                 max_completion_tokens；运行期遇上游明确拒绝也会自动切换
# 启动后可在前端「LLM 配置」页对任一 provider 运行连接诊断，自动识别以上细节。
# 示例：两块并存，simple 档用便宜的那家（取消注释并填好 .env 即生效）：
#   budget:
#     type: openai_compat
#     base_url: https://api.vendor-a.com/v1
#     default_model: model-a
#     api_key_env: VENDOR_A_API_KEY
#     max_tokens: 8192
#     supports_tools: true
#     supports_vision: false
#     context_window: 64000
#   premium:
#     type: anthropic
#     base_url: https://api.vendor-b.com
#     default_model: model-b
#     api_key_env: VENDOR_B_API_KEY
#     max_tokens: 8192
#     thinking_budget_tokens: 4096
#     supports_tools: true
#     supports_vision: true
#     context_window: 200000
providers:
  glm:
    # anthropic 原生协议：thinking block 一等公民（扩展思考流式/签名/多轮 tool_use
    # 规范回传），openai_compat 的 reasoning_content 扩展无 SDK 支持。
    type: anthropic
    base_url: https://open.bigmodel.cn/api/anthropic
    default_model: glm-5.3-flash
    api_key_env: GLM_API_KEY
    max_tokens: 8192
    thinking_budget_tokens: 4096              # 扩展思考预算（>0 开启；<max_tokens）
    supports_tools: true
    supports_vision: false
    context_window: 128000                    # GLM-5 128K 上下文

# ---- proxy 内嵌 MITM + 责任链过滤 + 聚合参数 + 进程入口 ----
proxy:
  allow_hosts: []               # HostFilter 白名单（空=放行全部）。e2e/生产都用真实 host 直连，无需在此维护
  exclude_methods:              # HTTP 方法黑名单
    - OPTIONS
    - HEAD
    - CONNECT
  exclude_hosts: []             # Host 黑名单（支持 *.example.com，黑名单优先于白名单）
  exclude_upgrade_protocols:    # Upgrade 协议黑名单（空时仍兜底拦 websocket）
    - websocket
  exclude_suffixes:             # 静态资源后缀黑名单（大小写不敏感）
    - .css
    - .js
    - .png
    - .jpg
    - .gif
    - .ico
    - .woff
    - .woff2
  exclude_content_types: []     # Content-Type 黑名单（支持 image/* 通配；大小写不敏感）
  exclude_status_codes:         # 状态码黑名单：原始流量为 4xx/5xx 表示业务异常，扫描无意义
    - 400      # Bad Request
    - 401      # Unauthorized
    - 403      # Forbidden
    - 404      # Not Found
    - 405      # Method Not Allowed
    - 408      # Request Timeout
    - 409      # Conflict
    - 410      # Gone
    - 413      # Payload Too Large
    - 414      # URI Too Long
    - 415      # Unsupported Media Type
    - 422      # Unprocessable Entity
    - 429      # Too Many Requests
    - 500      # Internal Server Error
    - 501      # Not Implemented
    - 502      # Bad Gateway
    - 503      # Service Unavailable
    - 504      # Gateway Timeout
  max_request_body_size: 2097152   # 2 MiB（稳健激进：覆盖偶有大上传/批量提交）
  max_response_body_size: 8388608  # 8 MiB（稳健激进：大列表/报表导出/长 HTML）

  # cmd/proxy 进程入口（纯 MITM 代理入口，存活检测探 TCP 8588，无独立 healthz HTTP）
  listen_addr: 0.0.0.0:8588         # 容器内监听（宿主映射 38588，见 compose）
  internal_addr: 127.0.0.1:18888    # proxify 内部 loopback

  # Redis Stream（proxy → ingestor 之间）
  stream_name: liusha:traffic_snapshots  # XADD 目标 stream（代理捕获的流量快照）
  stream_max_len: 100000            # XADD MAXLEN ~ 上限（约 5KiB×1e5 ≈ 500 MiB）

  # 容器内抓流量 → cmd/runner 的 /internal/v1/traffic/ingest endpoint Bearer token。
  # 空 = 不强制验证（开发模式，仅靠 bind 127.0.0.1 + docker bridge 网络隔离）。
  # 生产用 ENV LIUSHA_INGEST_TOKEN 注入，cmd/runner + sandbox 共享同一值（launcher 透传到 sandbox env）。
  ingest_token: ""

# ---- ingestor 流量摄入器（cmd/runner 内 goroutine）----
ingestor:
  consumer_group: liusha-ingestor   # XREADGROUP 消费组名（负载均衡单元，多副本共享）
  consumer_name: ""                 # consumer 实例名：留空自动派生 ingestor-<hostname>-<pid>（同组内唯一）；多副本务必留空
  read_batch: 16                    # 单次 XREADGROUP 取条数
  read_block_timeout_ms: 1000       # XREADGROUP BLOCK ms（无消息时阻塞上限）
  retry_delay_ms: 500               # XREADGROUP 失败重试延迟
  recreate_group_delay_ms: 500      # NOGROUP 自愈重建后等待 ms

# ---- credential.RedisProvider redis 前缀 ----
credential:
  redis_key_prefix: "credentials:"  # HSET <prefix><host> ...

# ---- cmd/runner 进程运行时参数 ----
runner:
  agent_run_timeout_seconds: 0             # 单个 agent run（一次完整认知循环，含全部四 Agent）的整体秒数上限。
  # 僵尸 run 回收（runner 硬杀后自动重投 planner，上限保护防崩溃循环）。
  # 全部留 0 = 内置默认：30s 扫描 / 6m 停摆判定（≈2×单步 LLM 看门狗）/ 4 次重投上限。
  run_recovery_interval_seconds: 0         # 扫描周期（秒）
  run_recovery_timeout_seconds: 0          # 任务级 LLM/工具活动停摆判定窗口（秒）
  run_recovery_max_attempts: 0             # 单任务自动重投上限（含首次；超限落 aborted）
                                           # 0 = 不限时——持续探索模式的正解：任务由完成检测器收敛，
                                           # 墙钟只是可选护栏；正数启用护栏，防失控任务烧 LLM 账单。
  max_steps_per_task: 0                    # 单任务步数上限（一次 agent 推理 = 一步）。
                                           # 0 = 不限——与上方墙钟同理，收敛交给完成检测器；正数启用护栏。
  step_llm_timeout_seconds: 300            # 单步 LLM Generate 看门狗（5 分钟）
  asynq_concurrency: 6                     # asynq 消费者并发数（同时跑的主 ReAct 数）
  asynq_shutdown_timeout_seconds: 30       # asynq.Shutdown 等 in-flight 主 ReAct 落地超时（超时后 asynq 强制中断）
  shutdown_timeout_seconds: 5              # graceful shutdown 超时（healthz/db pool 等）
  healthz_addr: ":8590"                    # 容器内监听（宿主映射 38590；沙盒回连端口经 LIUSHA_INGEST_PUBLIC_PORT 声明）
  queue_agent_weight: 5                   # asynq 队列优先级权重（数字越大越优先）

# ---- 容器化执行参数（sandbox.DockerLauncher + run_command 工具）----
# 容器内存/CPU 等由 sandbox.DockerLauncher 内部固定：单个暖池容器由并发任务共享（工作区按 批次 / 任务 隔离），无按任务调整的需求。
sandbox:
  default_image: ghcr.io/v3teran/liusha-sandbox:latest  # 沙箱镜像（CI 构建推 GHCR；含 sandbox-server PID 1 + browser-use + Kali 全量工具）。本地 `make build-sandbox` 同名 tag，docker run 直接命中本地不拉远端。compose 部署由 LIUSHA_SANDBOX_DEFAULT_IMAGE 钉到与业务镜像同一 tag。
  listener_ports: "21000-21999"    # 对外监听段（1:1 宿主映射）：反弹 shell/代理/payload 托管绑段内端口即 宿主IP:同号 可达；改段后重启自动重建暖池容器；空 = 不发布。段须避开业务端口与临时端口段。
  callback_host: ""                 # 目标回连地址（payload 里写它）。空 = 自动探测默认路由源地址；公网/NAT/多网卡场景填宿主公网 IP 或域名。
  # 键必须存在（值可空）：viper AutomaticEnv 只对 yaml 里已有的键生效——
  # 没有这行，容器编排注入的 LIUSHA_SANDBOX_WORKSPACE_DIR 到不了
  # Sandbox.WorkspaceHostDir，容器内回落 $HOME=/root 指向宿主不存在的路径
  # （runner 沙盒 bind 失败、api 工作区根目录错位）。空 = ~/data/liusha/workspace。
  workspace_dir: ""
  workspace_retention_days: 0    # 任务工作区留存天数（0 = 永久保留：持续探索的工件是证据；正数按目录 mtime 清扫）
  # 视口 1280×800：主流桌面宽度，页面渲染贴近真实用户视角；chromium 启动时固定，截图喂 vision LLM。
  viewport_width: 1280
  viewport_height: 800

conversation:
  # 单附件上传上限（字节）。会话页附件按钮：任务会话直落 <批次>/<任务>/inbox
  # （沙盒直接可见），纯聊天/未建任务先暂存 .staging/，下发任务时自动搬进 inbox。
  # 0 = 默认 100 MiB。env 覆盖：LIUSHA_CONVERSATION_ATTACHMENT_MAX_BYTES。
  attachment_max_bytes: 0
