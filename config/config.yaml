# ============================================================================
# Liusha 主配置（所有可调参数统一到本文件，避免散落代码 const）
#   - 仅放非敏感、可入库的开关与默认值
#   - 所有 *_API_KEY 走 env，本文件不出现密钥
#   - env 用 LIUSHA_ 前缀，支持二级覆盖
#     例 LIUSHA_LLM_FALLBACK 覆盖 llm.fallback
#   - 任一字段缺省时 config.ApplyDefaults() 自动兜底，不会拒启动
# ============================================================================

# ---- cmd/api HTTP 入口 ----
api:
  read_timeout_seconds: 15
  write_timeout_seconds: 30
  read_header_timeout_seconds: 5         # 也复用于 proxy/runner healthz HTTP server
  listen_addr: 0.0.0.0:8090
  shutdown_timeout_seconds: 5

# ---- pgxpool 连接参数 ----
postgres:
  max_conns: 20
  min_conns: 2
  connect_timeout_seconds: 5
  max_conn_lifetime_seconds: 3600

# ---- go-redis client pool 参数 ----
# addr 仍由 ENV LIUSHA_REDIS_ADDR 提供（运维敏感）。
# 字段为 0 时透传 go-redis SDK 默认值（PoolSize=10×GOMAXPROCS / DialTimeout=5s /
# ReadTimeout=3s / WriteTimeout=3s）；多服务共享 redis 时按需调小 PoolSize 防 fd 爆。
redis:
  pool_size: 0                             # 0 = SDK 默认（10 × GOMAXPROCS）
  min_idle_conns: 0
  dial_timeout_seconds: 0                  # 0 = SDK 默认 5
  read_timeout_seconds: 0                  # 0 = SDK 默认 3
  write_timeout_seconds: 0                 # 0 = SDK 默认 3

# ---- LLM 能力分档路由 ----
# 事实源已迁 DB（前端「模型 / 能力分档」页 CRUD，见 migration 0097/0099/0103/0105），本段仅供空库
# 首次种子导入（insert-only，见 internal/config/seed/llm.go），DB 已有数据后不再生效。
#
# 分档模型（0105 起）：agent → tier → provider 两跳。
#   · agent → tier 的绑定固定在代码里（internal/config/llmcfg AgentTier），运行期不可改：
#       planner / exploitation → vision（需 browser-use 截图，多模态）
#       traffic-analysis            → heavy （流量逐批挖洞，重推理纯文本）
#       inspector / compactor       → light （旁路督查 / 历史压缩，轻任务省钱）
#     未显式归档的 agent 一律落 heavy（隐式默认档）。
#   · tier → provider 的绑定落 DB（前端「能力分档」页可配），此处仅首次种子。
# 全路径统一小米 MiMo（provider key: mimo），fallback 亦指向同一 provider（当前仅此一个模型）。
llm:
  tiers:
    simple:  mimo   # 快速响应，简单任务（信息提取、格式化）
    medium:  mimo   # 标准推理，常规任务（漏洞检测、工具调用）- 默认档位
    complex: mimo   # 深度推理，复杂决策（战略规划、多步分析、多模态）
  fallback: mimo   # 主 provider 重试耗尽后的全局备胎

  # spec §8.5 错误码退避表（429/529/5xx/网络超时）
  retry:
    max_429: 3                       # 429 限流重试次数
    max_529: 1                       # 529 服务忙重试次数
    max_5xx: 2                       # 5xx 服务端错重试次数
    max_net: 2                       # 网络超时重试次数
    backoff_429_seconds: [1, 4, 16]  # 429 指数退避（秒）
    backoff_5xx_seconds: [1, 4]
    backoff_net_seconds: [1, 3]
    backoff_529_ms: 0                # 529 立即重试

  # llm_invocation 异步 batch 写入：Generate 路径 0 阻塞
  invocation:
    buffer_size: 1024                # channel 缓冲；满则丢一行（warn）
    batch_size: 100                  # 累积此行数即触发 flush
    flush_interval_ms: 1000          # 兜底 flush 周期
    insert_timeout_sec: 5            # 单次 batch insert 超时

# 仅供空库首次种子导入（insert-only，见上方 llm: 段说明）；DB 是事实源，改模型走前端「LLM 配置」页。
providers:
  # —— 小米 MiMo（Token Plan 固定订阅，OpenAI 兼容协议，token-plan-cn.xiaomimimo.com）★当前唯一激活 provider（见 .env.local）
  # 同 XIAOMI_API_KEY（tp- 开头）；mimo-v2.5 支持 vision + tool calls。
  mimo:
    type: openai_compat
    base_url: https://token-plan-cn.xiaomimimo.com/v1
    default_model: mimo-v2.5
    api_key_env: XIAOMI_API_KEY
    max_tokens: 16384                         # 单次输出 cap（mimo-v2.5 最大输出 128K，按需可上调至 131072）
    supports_tools: true
    supports_vision: true
    context_window: 1048576                   # 小米官方 1M 上下文

# ---- proxy 内嵌 MITM + 责任链过滤 + 聚合参数 + 进程入口 ----
proxy:
  window_batch: 20              # TrafficWindow 批大小上限（满即关闭 → 立即触发 sniffer）
  window_max_age_seconds: 30    # ager 兜底：超过此秒数仍 open 的窗口会被强制关闭并入队 sniffer（低流量场景）
  allow_hosts: []               # HostFilter 白名单（空=放行全部）。e2e/生产都用真实 host 直连，无需在此维护
  exclude_methods:              # HTTP 方法黑名单
    - OPTIONS
    - HEAD
    - CONNECT
  exclude_hosts: []             # Host 黑名单（支持 *.example.com，黑名单优先于白名单）
  exclude_upgrade_protocols:    # Upgrade 协议黑名单（空时仍兜底拦 websocket）
    - websocket
  exclude_suffixes:             # 静态资源后缀黑名单（大小写不敏感）
    - .css
    - .js
    - .png
    - .jpg
    - .gif
    - .ico
    - .woff
    - .woff2
  exclude_content_types: []     # Content-Type 黑名单（支持 image/* 通配；大小写不敏感）
  exclude_status_codes:         # 状态码黑名单：原始流量为 4xx/5xx 表示业务异常，扫描无意义
    # 注：v0024 重构后 agent 直接由 sandbox 工具（sqlmap/curl/nuclei…）直接打目标，不再走 internal/replay 重放
    - 400      # Bad Request
    - 401      # Unauthorized
    - 403      # Forbidden
    - 404      # Not Found
    - 405      # Method Not Allowed
    - 408      # Request Timeout
    - 409      # Conflict
    - 410      # Gone
    - 413      # Payload Too Large
    - 414      # URI Too Long
    - 415      # Unsupported Media Type
    - 422      # Unprocessable Entity
    - 429      # Too Many Requests
    - 500      # Internal Server Error
    - 501      # Not Implemented
    - 502      # Bad Gateway
    - 503      # Service Unavailable
    - 504      # Gateway Timeout
  max_request_body_size: 2097152   # 2 MiB（稳健激进：覆盖偶有大上传/批量提交）
  max_response_body_size: 8388608  # 8 MiB（稳健激进：大列表/报表导出/长 HTML）

  # cmd/proxy 进程入口（纯 MITM passive 入口，存活检测探 TCP 8888，无独立 healthz HTTP）
  listen_addr: 0.0.0.0:8888         # sanitizer 公开端口
  internal_addr: 127.0.0.1:18888    # proxify 内部 loopback
  cert_subdir: .liusha              # CA 证书子目录（默认 $HOME/.liusha）
  shutdown_timeout_seconds: 5       # graceful shutdown 超时

  # Redis Stream（proxy → ingestor 之间）
  stream_name: flow_events          # XADD 目标 stream
  stream_max_len: 100000            # XADD MAXLEN ~ 上限（约 5KiB×1e5 ≈ 500 MiB）

  # 容器内抓流量 → cmd/runner 的 /internal/v1/flows/ingest endpoint Bearer token。
  # 空 = 不强制验证（开发模式，仅靠 bind 127.0.0.1 + docker bridge 网络隔离）。
  # 生产用 ENV LIUSHA_INGEST_TOKEN 注入，cmd/runner + sandbox 共享同一值（launcher 透传到 sandbox env）。
  ingest_token: ""

# ---- ingestor 流量摄入器（cmd/runner 内 goroutine）----
ingestor:
  consumer_group: liusha-ingestor   # XREADGROUP 消费组名（负载均衡单元，多副本共享）
  consumer_name: ""                 # consumer 实例名：留空自动派生 ingestor-<hostname>-<pid>（同组内唯一）；多副本务必留空
  read_batch: 16                    # 单次 XREADGROUP 取条数
  read_block_timeout_ms: 1000       # XREADGROUP BLOCK ms（无消息时阻塞上限）
  retry_delay_ms: 500               # XREADGROUP 失败重试延迟
  recreate_group_delay_ms: 500      # NOGROUP 自愈重建后等待 ms

# ---- session 参数（agent prompt 上限；合表后 passive task 无常驻监控，sweeper/TTL 已删）----
session:
  # agent user prompt 拼装上限（避免 prompt 膨胀；超出 LLM 用 read_findings/read_lessons 工具按需查）
  findings_limit_in_prompt: 1000    # 该 host finding DB 读上限安全闸（全量注入不截断；超长由 ① 压缩）
  # lessons_limit_in_prompt 已删：跨目标知识改 corpus PULL 检索（search_corpus），不再 PUSH 注入

# ---- credential.RedisProvider redis 前缀 ----
credential:
  redis_key_prefix: "credentials:"  # HSET <prefix><host> ...

# ---- skills 外部目录 ----
skills:
  root: ./skills

# ---- cmd/runner 进程运行时参数 ----
runner:
  solo_agent_run_timeout_seconds: 3600     # solo 引擎单个 agent task 整体超时（asynq handler 入口 WithTimeout，60 分钟，> step_tool）
  swarm_agent_run_timeout_seconds: 14400   # swarm 引擎整体超时（4 小时，对齐 sandbox max lifetime；站点扫描爬+测耗时长）
  step_llm_timeout_seconds: 300            # 单步 LLM Generate 看门狗（5 分钟）
  asynq_concurrency: 6                     # asynq 消费者并发数（同时跑的主 ReAct 数）
  asynq_shutdown_timeout_seconds: 30       # asynq.Shutdown 等 in-flight 主 ReAct 落地超时（超时后 asynq 强制中断）
  shutdown_timeout_seconds: 5              # graceful shutdown 超时（healthz/db pool 等）
  healthz_addr: ":9090"                    # /healthz HTTP 监听地址
  traffic_max_request_body: 2097152        # 2 MiB；traffic.Store 入库截断阈值（与 proxy.max_request_body_size 对齐）
  traffic_max_response_body: 8388608       # 8 MiB；traffic.Store 入库截断阈值（与 proxy.max_response_body_size 对齐）
  queue_agent_weight: 5                   # asynq 队列优先级权重（数字越大越优先）
  queue_dispatch_weight: 1
  per_host_concurrency: 2                  # per-host 并发上限（§4.3）；同 host 同时运行 task 数超限则退避重试；≤0 关闭限速

# ---- 会话历史压缩参数 ----
compaction:
  # 会话 msgs 滑窗压缩参数（防 context 爆 + 控延迟）。
  # 触发时机：每步 Generate 前算 total tokens；超 trigger_ratio × provider.context_window 启动压缩。
  # 永保策略：system + 首条 user prompt + trailing_budget_ratio × ctx_window 反向累加（turn 边界对齐）。
  # 蒸馏：候选集一次性送 light_provider；失败 head-truncate 兜底。
  # 协同：与 notes/lesson/finding 分层记忆联动——蒸馏 prompt 引导省略"已 write_* 上提"内容。
  history_compact:
    trigger_ratio: 0.75                     # > 75% × ctx_window 触发 eino summarization 压缩
    trailing_budget_ratio: 0.15             # ② 会话历史最多占窗口比例（支撑性上下文，留 85% 给任务+finding+工作空间）；随窗口缩放
    compactor_timeout_seconds: 30           # ② 旧会话蒸馏单次 light LLM 超时

# ---- 容器化执行参数（sandbox.Launcher + external.RunCommand）----
# 容器内存/CPU/并发数等运行时参数下放到 sandbox.DockerLauncher 内部硬编码
# （per-agent-run 容器模型下这些参数没有按 session 调整的需求）。
# 见 docs/superpowers/specs/2026-05-16-sandbox-server-design.md
sandbox:
  default_image: ghcr.io/v3teran/liusha-pentools:latest    # 沙箱镜像（CI 构建推 GHCR；含 sandbox-server PID 1 + browser-use + Kali 全量工具）。本地 `make build-pentools` 同名 tag，docker run 直接命中本地不拉远端。
  # run_command 单次硬超时由 LLM 通过 timeout_seconds 必传，上限钳到 toolruntime.step_tool_timeout_seconds（1800s）
  run_tail_bytes: 8192                     # 主进程 RunCommand 对 stdout/stderr 截尾字节数；sandbox-server 返回完整 stdout，截尾在主进程层
  # 视口 1280×800：主流桌面宽度，页面渲染贴近真实用户视角；chromium 启动时固定，截图喂 vision LLM。
  viewport_width: 1280
  viewport_height: 800

# ---- toolruntime Interceptor 参数 ----
toolruntime:
  step_tool_timeout_seconds: 1800       # 单步 tool Execute 上限（30 分钟）；run_command 用此值钳 LLM 自传的 timeout_seconds；其他工具（write_finding 等）受 Interceptor 层 WithTimeout 兜底。&lt; solo_agent_run_timeout_seconds=3600

# ---- heuristic 关键词清单 ----
# yaml 化便于按业务扩中文/小语种关键词，AllAuthError 运行时 lowercase 匹配