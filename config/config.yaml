# ============================================================================
# Liusha v1 主配置（v1.3 收敛：所有可调参数统一到本文件，避免散落代码 const）
#   - 仅放非敏感、可入库的开关与默认值
#   - 所有 *_API_KEY 走 env，本文件不出现密钥
#   - env 用 LIUSHA_ 前缀，支持二级覆盖
#     例 LIUSHA_LLM_DEFAULT_PROVIDER 覆盖 llm.default_provider
#   - 任一字段缺省时 config.ApplyDefaults() 自动兜底，不会拒启动
# ============================================================================

# ---- cmd/api HTTP 入口 ----
api:
  read_timeout_seconds: 15
  write_timeout_seconds: 30
  read_header_timeout_seconds: 5         # 也复用于 proxy/scanner healthz HTTP server
  listen_addr: 0.0.0.0:8080
  shutdown_timeout_seconds: 5

# ---- pgxpool 连接参数 ----
postgres:
  max_conns: 20
  min_conns: 2
  connect_timeout_seconds: 5
  max_conn_lifetime_seconds: 3600

# ---- go-redis client pool 参数 ----
# addr 仍由 ENV LIUSHA_REDIS_ADDR 提供（运维敏感）。
# 字段为 0 时透传 go-redis SDK 默认值（PoolSize=10×GOMAXPROCS / DialTimeout=5s /
# ReadTimeout=3s / WriteTimeout=3s）；多服务共享 redis 时按需调小 PoolSize 防 fd 爆。
redis:
  pool_size: 0                             # 0 = SDK 默认（10 × GOMAXPROCS）
  min_idle_conns: 0
  dial_timeout_seconds: 0                  # 0 = SDK 默认 5
  read_timeout_seconds: 0                  # 0 = SDK 默认 3
  write_timeout_seconds: 0                 # 0 = SDK 默认 3

# ---- LLM 多 provider 路由（黑客松借鉴：创新 11）----
# default_provider:  主 ReAct（sniffer / 子任务）共用，重模型
# light_provider:    Observer / Compaction / LessonExtract 走的轻模型，省成本
# vision_provider:   v1.5 的 browser.screenshot 用，v1 仅作为备用主 LLM
# fallback_provider: 429/529 退避耗尽后切到，retry 中间件用
llm:
  default_provider: deepseek
  light_provider: anthropic_haiku
  vision_provider: anthropic
  fallback_provider: openai
  max_steps: 30                 # ReAct 单任务步数上限，被 Role.Budget 覆盖
  max_tokens_per_call: 4096
  # 双 namespace（v1.1 改造）：把"真 agent"与"single-shot utility"语义分开。
  agents:
    orchestrator: default_provider   # 主 ReAct（分类流量、派发 hunter、收尾）
    hunter:       default_provider   # 子 ReAct（漏洞猎手：BAC / 未来 SQLi/SSRF/IDOR）
    observer:     light_provider     # 旁路过程判官（每 5 步评估方向）
  utilities:
    lesson_extract: light_provider   # finding → ≤500 字 lesson，落 host_lesson
    vision:       vision_provider    # 多模态视觉（未启用）

  # spec §8.5 错误码退避表（429/529/5xx/网络超时）
  retry:
    max_429: 3                       # 429 限流重试次数
    max_529: 1                       # 529 服务忙重试次数
    max_5xx: 2                       # 5xx 服务端错重试次数
    max_net: 2                       # 网络超时重试次数
    backoff_429_seconds: [1, 4, 16]  # 429 指数退避（秒）
    backoff_5xx_seconds: [1, 4]
    backoff_net_seconds: [1, 3]
    backoff_529_ms: 0                # 529 立即重试

  # llm_invocation 异步 batch 写入（v1.1 性能改造，Generate 路径 0 阻塞）
  invocation:
    buffer_size: 1024                # channel 缓冲；满则丢一行（warn）
    batch_size: 100                  # 累积此行数即触发 flush
    flush_interval_ms: 1000          # 兜底 flush 周期
    insert_timeout_sec: 5            # 单次 batch insert 超时

# 每个 provider 一节；只填要用的，其它留空即可
# api_key_env 是从 env 读 key 的变量名
providers:
  # type: openai_compat → sashabaranov/go-openai 调 /v1/chat/completions
  # type: anthropic     → anthropics/anthropic-sdk-go 调 /v1/messages
  deepseek:
    type: openai_compat
    base_url: https://api.deepseek.com/v1
    default_model: deepseek-chat
    api_key_env: DEEPSEEK_API_KEY
    max_tokens: 4096
    supports_tools: true
    supports_vision: false

  anthropic:
    type: anthropic
    base_url: https://api.anthropic.com
    default_model: claude-sonnet-4-6
    vision_model: claude-haiku-4-5
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 8192
    supports_tools: true
    supports_vision: true

  anthropic_haiku:
    type: anthropic
    base_url: https://api.anthropic.com
    default_model: claude-haiku-4-5
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 4096
    supports_tools: true
    supports_vision: true

  openai:
    type: openai_compat
    base_url: https://api.openai.com/v1
    default_model: gpt-4o
    api_key_env: OPENAI_API_KEY
    max_tokens: 4096
    supports_tools: true
    supports_vision: true

  moonshot:
    type: openai_compat
    base_url: https://api.moonshot.cn/v1
    default_model: kimi-k2-0905-preview
    api_key_env: MOONSHOT_API_KEY
    max_tokens: 4096
    supports_tools: true
    supports_vision: false

  qwen:
    type: openai_compat
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    default_model: qwen3-max
    api_key_env: QWEN_API_KEY
    max_tokens: 4096
    supports_tools: true
    supports_vision: false

# ---- LLM 模型单价表（USD per 1M tokens）----
# 单价频繁变动（provider 季度降价）→ yaml 化便于不重编更新；新模型上线只需在此 append。
# key 形如 "<provider>/<model>"，与 ProviderConfig + Model() 拼接一致。
# cached_in_in:
#   - true（OpenAI/DeepSeek 兼容）：cached_tokens ⊆ in_tokens；先减再分别计价
#   - false（Anthropic 原生）：cached 独立计价（"加项"）
pricing:
  models:
    "deepseek/deepseek-chat":
      input_per_m_usd: 0.27
      output_per_m_usd: 1.10
      cache_discount: 0.10
      cached_in_in: true
    "anthropic/claude-sonnet-4-6":
      input_per_m_usd: 3.00
      output_per_m_usd: 15.00
      cache_discount: 0.30
      cached_in_in: false
    "anthropic/claude-haiku-4-5":
      input_per_m_usd: 1.00
      output_per_m_usd: 5.00
      cache_discount: 0.30
      cached_in_in: false

# ---- proxy 内嵌 MITM + 责任链过滤 + 聚合参数 + 进程入口 ----
proxy:
  window_batch: 20              # TrafficWindow 批大小上限（满即关闭 → 立即触发 sniffer）
  window_max_age_seconds: 30    # ager 兜底：超过此秒数仍 open 的窗口会被强制关闭并入队 sniffer（低流量场景）
  allow_hosts:                  # HostFilter 白名单（空=放行全部；支持 *.example.com 前缀通配 + 其裸根域）
    - vulnapp                   # v1 e2e 靶机（docker 模式）
    - host.docker.internal      # 容器内 scanner → host vulnapp（docker 模式）
    - 127.0.0.1                 # host 模式 IP 直连（多个本地端口都走 127.0.0.1，HostFilter 内部 stripPort 后端口无关）
  exclude_methods:              # HTTP 方法黑名单
    - OPTIONS
    - HEAD
    - CONNECT
  exclude_hosts: []             # Host 黑名单（支持 *.example.com，黑名单优先于白名单）
  exclude_upgrade_protocols:    # Upgrade 协议黑名单（空时仍兜底拦 websocket）
    - websocket
  exclude_suffixes:             # 静态资源后缀黑名单（大小写不敏感）
    - .css
    - .js
    - .png
    - .jpg
    - .gif
    - .ico
    - .woff
    - .woff2
  exclude_content_types: []     # Content-Type 黑名单（支持 image/* 通配；大小写不敏感）
  exclude_status_codes:         # 状态码黑名单：原始流量为 4xx/5xx 表示业务异常，扫描无意义
    # 注：BAC/SQLi 信号在重放阶段产生（走 internal/replay/engine.go），不经过 proxy 过滤链
    - 400      # Bad Request
    - 401      # Unauthorized
    - 403      # Forbidden
    - 404      # Not Found
    - 405      # Method Not Allowed
    - 408      # Request Timeout
    - 409      # Conflict
    - 410      # Gone
    - 413      # Payload Too Large
    - 414      # URI Too Long
    - 415      # Unsupported Media Type
    - 422      # Unprocessable Entity
    - 429      # Too Many Requests
    - 500      # Internal Server Error
    - 501      # Not Implemented
    - 502      # Bad Gateway
    - 503      # Service Unavailable
    - 504      # Gateway Timeout
  max_request_body_size: 2097152   # 2 MiB（稳健激进：覆盖偶有大上传/批量提交）
  max_response_body_size: 8388608  # 8 MiB（稳健激进：大列表/报表导出/长 HTML）

  # cmd/proxy 进程入口
  listen_addr: 0.0.0.0:8888         # sanitizer 公开端口
  internal_addr: 127.0.0.1:18888    # proxify 内部 loopback
  healthz_addr: :9091               # /healthz HTTP（避免与 scanner :9090 冲突）
  cert_subdir: .liusha              # CA 证书子目录（默认 $HOME/.liusha）
  shutdown_timeout_seconds: 5       # graceful shutdown 超时

  # Redis Stream（proxy → ingestor 之间）
  stream_name: flow_events          # XADD 目标 stream
  stream_max_len: 100000            # XADD MAXLEN ~ 上限（约 5KiB×1e5 ≈ 500 MiB）

# ---- ingestor 流量摄入器（cmd/scanner 内 goroutine）----
ingestor:
  consumer_group: liusha-ingestor   # XREADGROUP consumer group 名
  consumer_name: ingestor-1         # consumer 实例名（多实例时区分）
  read_batch: 16                    # 单次 XREADGROUP 取条数
  read_block_timeout_ms: 1000       # XREADGROUP BLOCK ms（无消息时阻塞上限）
  retry_delay_ms: 500               # XREADGROUP 失败重试延迟
  recreate_group_delay_ms: 500      # NOGROUP 自愈重建后等待 ms

# ---- engagement 懒创建 + 24h 归档 + Rotator 阈值 ----
engagement:
  idle_timeout_hours: 24            # 空闲多久 sweeper 自动 abort
  sweeper_interval_seconds: 600     # sweeper 轮询周期
  # Rotator 三阈值（proxy 模式滚动新 engagement，任一命中即触发）
  max_age_hours: 24                 # 从 CreatedAt 起超过此小时数即滚动
  max_state_size_bytes: 2097152     # memory_notes jsonb 字节数超过即滚动（2 MiB）
  max_findings: 300                 # 累计 finding 数超过即滚动（中型目标一轮可能积累几百条，过早轮转会切断 lesson 沉淀链）
  # memory_notes 截断
  max_memory_notes_entries: 300     # appendInto 滚动到末尾保留条数
  default_notes_limit: 200          # ReadStateScoped 默认截断（输入 0 时使用）
  default_tenant: default           # 单租户兜底；多租户后由 caller 显式传 tenant

# ---- credential.RedisProvider redis 前缀 ----
credential:
  redis_key_prefix: "credentials:"  # HSET <prefix><host> ...

# ---- skills 外部目录 ----
skills:
  root: ./skills

# ---- cmd/scanner 进程运行时参数 ----
scanner:
  main_max_steps: 60                       # 单个主 ReAct 循环步数上限
  main_task_timeout_seconds: 4200          # 单个主 ReAct 任务整体超时（asynq handler 入口 WithTimeout，70 分钟；≥ sub_task_timeout + 主 ReAct 自身收尾）
  main_watchdog_seconds: 300               # 单个主 ReAct 单步 LLM Generate 看门狗（秒）
  asynq_concurrency: 6                     # asynq 消费者并发数（同时跑的主 ReAct 数）
  asynq_shutdown_timeout_seconds: 30       # asynq.Shutdown 等 in-flight 主 ReAct 落地超时（超时后 asynq 强制中断）
  shutdown_timeout_seconds: 5              # graceful shutdown 超时（healthz/db pool 等）
  healthz_addr: ":9090"                    # /healthz HTTP 监听地址
  flow_max_request_body: 2097152           # 2 MiB；flow.Store 入库截断阈值（与 proxy.max_request_body_size 对齐）
  flow_max_response_body: 8388608          # 8 MiB；flow.Store 入库截断阈值（与 proxy.max_response_body_size 对齐）
  queue_hunter_weight: 5                   # asynq 队列优先级权重（数字越大越优先）
  queue_dispatch_weight: 1

# ---- 主 ReAct 循环参数 ----
react:
  observer_every_steps: 5                  # 每 N 步触发一次 Observer 评估
  done_force_max_rejects: 3                # done 被 done_validate 连续拒绝 N 次后强制放行
  observer_args_truncate: 256              # 喂 observer LLM 的 tool args 截断字节数（80B 看不出意图）
  observer_obs_truncate: 400               # 喂 observer LLM 的 ObsSummary 截断字节数

# ---- 漏洞子 ReAct 通用参数（SQLi/BAC 共用）----
vuln:
  sub_max_steps: 30                        # 子 ReAct budget 步数（覆盖 SQLi Step 5b 多次自构 + take_note 的最坏路径）
  sub_task_timeout_seconds: 3600           # 单个子 ReAct 任务整体超时（delegate 派发时 WithTimeout，60 分钟；≥ tool_execute_timeout=1800×2，给 30 步 + sqlmap 多次升级充足空间）
  sub_watchdog_seconds: 120                # 子 ReAct 单步 LLM 调用超时（仅包 LLM Generate；防 provider 端卡死。anthropic+thinking+大上下文需余量）
  flow_body_prompt_limit: 8192             # user prompt 中 request/response body 截断（与 probe.body_hint_max_bytes 对齐：LLM 看初始流量 vs 重放后响应同等粒度）
  lessons_prompt_limit: 40                 # host 历史 lesson top-N

# ---- 漏洞探针工具参数（probe.ReplayMatrix / ComputeSimilarity）----
probe:
  body_hint_max_bytes: 8192                # run_replay 返回 body_hint 截断（与 vuln.flow_body_prompt_limit 对齐；SQLi 报错常在 HTML 后段）
  default_concurrency: 5                   # run_replay 默认并发（与 replay.concurrency 对齐）
  similarity_min_threshold: 0.6            # compute_similarity 低阈
  similarity_high_threshold: 0.9           # compute_similarity 高阈
  length_ratio_gate: 0.3                   # 长度差距阈值，低于则跳过 JSON/Jaccard 计算

# ---- 容器化执行参数（external.RunCommand + DockerRunner）----
sandbox:
  default_image: liusha/pentools:1.0.0     # 默认沙箱镜像（预装 sqlmap/curl/python3/sh/jq）
  run_min_timeout_seconds: 30              # run_command 单次最小超时（钳）
  run_max_timeout_seconds: 300             # run_command 单次最大超时（钳）
  run_default_timeout_seconds: 90          # run_command 默认超时
  run_default_mem_mb: 512                  # 容器内存上限（MB）
  run_default_cpus: 1.0                    # 容器 CPU 上限（核数）
  run_tail_bytes: 8192                     # stdout/stderr 各保留尾部字节数（关键瓶颈：sqlmap level=5+tamper 输出经常超 1.5KB）
  runner_concurrency: 5                    # DockerRunner 全局并发上限
  scan_network: ""                         # 限制扫描容器网络（如 "liusha_scan_net"）；空 = docker 默认 bridge

# ---- toolruntime 中间件参数 ----
# 不变量：result_compress_threshold ≥ 2 × sandbox.run_tail_bytes（确保 stdout+stderr 满载也不立即触发压缩）
# v1.3：result_compress 不再落盘，只做"超阈值截断后喂 LLM"——engagement-store/*.txt 已下线（无下游消费方）
toolruntime:
  result_compress_threshold: 65536         # 64KB；工具 Output 超过此字节即截断（不落盘）；≥ 2 × sandbox.run_tail_bytes=8192 + run_replay 5 variant 矩阵余量
  result_compress_snippet: 16384           # 16KB；截断后喂 LLM 的 Output 概览大小（足够看清 sqlmap stdout / 多 variant 矩阵）
  result_compress_summary: 1024            # 1KB；Result.Summary（喂 Observer 滑动窗；与 react.observer_obs_truncate 对齐）
  tool_execute_timeout_seconds: 1800       # 30 分钟；单次 tool Execute 兜底超时（middleware WithTimeout；防 sqlmap 升级 / fetch_credentials 等卡死。≥ sandbox.run_max_timeout_seconds=300，≤ sub_task_timeout=3600）

# ---- replay engine 参数 ----
replay:
  concurrency: 5                           # ReplayMatrix 默认并发上限
  http_timeout_seconds: 30                 # 单次重放 HTTP 调用上限；防止目标慢响应阻塞整批 ReplayMatrix

# ---- classify_traffic 喂 LLM 前的 flow 截断阈值 ----
# 设计原则：keys 全保留；string value 给足空间体现业务字段语义；
# 敏感 header value 直接 redact（cookie/authorization/token 等，安全要求）。
# 不变量：max_raw_body_bytes ≤ proxy.max_request_body_size；max_response_body_bytes ≤ proxy.max_response_body_size；
#         response_body_tail_bytes < max_response_body_bytes（前+尾结构）。
classify:
  max_query_value_len: 256               # 单个 query value 截断长度（覆盖 search 词 / UUID / 长 token）
  max_body_string_value_len: 256         # JSON body 中 string value 截断长度
  max_raw_body_bytes: 4096               # 非 JSON request body 截断字节数
  max_response_body_bytes: 8192          # 响应 body 截断字节数（前缀 + 尾部；与 vuln/probe 8192 对齐）
  response_body_tail_bytes: 1024         # 截断后保留的尾部字节数（前 7K + 尾 1K）

# ---- lesson 提取与 touch 重试参数 ----
# 首发 LessonExtract 是异步 LLM 调用（~2-10s），重发现 hook 触发时 lesson 可能未建好；
# 几何 backoff（默认 500ms→1s→2s→4s→4s→4s→4s = 19.5s 总）覆盖慢 LLM。
lesson:
  extracted_priority: 7                  # LessonExtract 写入 lesson 时的固定优先级（中-高）
  extract_timeout_seconds: 60            # extractLesson 整体超时（hook 用 context.Background()，业务级兜底防 LLM 永久挂起）
  touch_max_retries: 7                   # hit_count 重试次数
  touch_initial_backoff_ms: 500          # 首次重试 backoff
  touch_max_backoff_ms: 4000             # 重试 backoff 上限（几何递增 cap）

# ---- heuristic 关键词清单 ----
# yaml 化便于按业务扩中文/小语种关键词，AllAuthError 运行时 lowercase 匹配
heuristic:
  auth_keywords:
    # 中文
    - 未登录
    - 请登录
    - 登录后
    - 需要登录
    - 请先登录
    - 无权访问
    - 权限不足
    - 未授权
    - 无权操作
    - 拒绝访问
    - 禁止访问
    # 中英混合
    - 会话过期
    - token 已过期
    - token expired
    # 英文
    - login required
    - please login
    - not authorized
    - unauthorized
    - forbidden
    - permission denied
    - access denied
    - session expired
    - invalid token
    - authentication required
    - auth required
