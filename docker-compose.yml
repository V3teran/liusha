# liusha 基座 compose：核心 6 服务全容器（生产形态直接用；本地开发见 scripts/dev/up.sh）。
#
# ── 三种部署形态（详见 deployments/README.md）─────────────────────────────
#  A 本地开发：docker compose up -d postgres redis（compose 文件在仓库根，根 .env 自动加载）
#    （仅 pg+redis 两容器）+ ./scripts/dev/run-svc.sh 业务进程 host 二进制；
#    runner 经宿主 docker 拉起第三个容器（沙盒 pentools，warm pool 自动管理）。
#  B 生产全容器：make prod-up（= 迁移 + 本文件 + docker-compose.prod.yml 叠加 up）。
#    核心 6 服务（postgres/redis/api/nginx/proxy/runner）默认全起，无 profile 门控。
#  C 单镜像：make single-build（deployments/single/，比赛/受限环境用）。
#
# nginx 前置：/ → 前端 SPA，/api/* → api:8090（前端源码在仓库根 web/，同仓 monorepo）。
# proxy（cmd/proxy）：内嵌 proxify SDK 的 MITM + filter/dedup/aggregator + Asynq 生产者，监听 8888。
# runner（cmd/runner）：Asynq 消费者 + ReAct 引擎，监听 9090（healthz + 流量 ingest）。
# 业界最佳实践：proxy 与 worker 独立进程，故障隔离 + 独立扩缩。

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: liusha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: liusha
      POSTGRES_PASSWORD: liusha
      POSTGRES_DB: liusha
    ports:
      - "5432:5432"
    volumes:
      - liusha-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liusha -d liusha"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8
    container_name: liusha-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - liusha-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: liusha/api:1.0
    build:
      context: .
      dockerfile: cmd/api/Dockerfile
    container_name: liusha-api
    restart: unless-stopped
    environment:
      LIUSHA_POSTGRES_DSN: postgres://liusha:liusha@postgres:5432/liusha?sslmode=disable
      LIUSHA_REDIS_ADDR: redis:6379
      LIUSHA_API_ADDR: 0.0.0.0:8090  # 与本地 dev（run-svc.sh）同端口；8080 易被 Burp 占用
      LIUSHA_API_KEY: "${LIUSHA_API_KEY:-changeme-dev-key}"
      # 测试期免认证：设置后 X-API-Key 与 SSE stream cookie 校验全部跳过（auth.go 直通）。
      # 恢复认证 = 删除本行并重建 api 容器。
      LIUSHA_AUTH_DISABLED: "true"
      LIUSHA_ENV: development
      LIUSHA_LOG_LEVEL: info
      LIUSHA_CONFIG: /app/config/config.yaml
      # LLM provider key：使用 GLM
      GLM_API_KEY: "${GLM_API_KEY:-placeholder-key}"
      # SSE stream cookie 签名密钥：cmd/api fail-fast 必需（空则启动崩溃）。dev 默认占位，prod 必须覆盖。
      LIUSHA_STREAM_COOKIE_SECRET: "${LIUSHA_STREAM_COOKIE_SECRET:-changeme-dev-stream-secret}"
      # LLM provider 密钥加密密钥：用于加密存储在数据库中的 API keys
      LIUSHA_LLM_KEY_SECRET: "${LIUSHA_LLM_KEY_SECRET:-changeme-dev-encryption-secret-must-be-32-chars}"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--header=X-API-Key: ${LIUSHA_API_KEY:-changeme-dev-key}", "http://localhost:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  # nginx：前置反代 + 前端 SPA 托管。/ → web/dist（多阶段构建内嵌），/api/* → api:8090。
  # 前端源码在仓库根 web/，与后端同仓（monorepo）。SSE 端点在 nginx.conf 里单独关缓冲。
  nginx:
    image: liusha/nginx:1.0
    build:
      context: .
      dockerfile: deployments/nginx/Dockerfile
    container_name: liusha-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 10s
      timeout: 3s
      retries: 3

  # cmd/proxy：内嵌 proxify SDK 的 MITM 代理 + filter/dedup/aggregator + Asynq 生产者
  proxy:
    image: liusha/proxy:1.0
    build:
      context: .
      dockerfile: cmd/proxy/Dockerfile
    container_name: liusha-proxy
    restart: unless-stopped
    environment:
      LIUSHA_POSTGRES_DSN: postgres://liusha:liusha@postgres:5432/liusha?sslmode=disable
      LIUSHA_REDIS_ADDR: redis:6379
      LIUSHA_CONFIG: /app/config/config.yaml
      LIUSHA_ENV: development
      LIUSHA_LOG_LEVEL: info
      LIUSHA_PROXY_LISTEN_ADDR: 0.0.0.0:8888
      LIUSHA_PROXY_CERT_DIR: /app/certs
      # LLM provider key：使用 GLM
      GLM_API_KEY: "${GLM_API_KEY:-placeholder-key}"
    volumes:
      - liusha-proxy-certs:/app/certs
      - ./logs:/app/logs
    ports:
      - "8888:8888"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # proxy 纯 MITM，无 healthz HTTP——探 TCP 8888（mitm 口）是否在听。
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8888"]
      interval: 10s
      timeout: 3s
      retries: 3

  # runner：Asynq 消费者 + ReAct 引擎（不再装 mitm，已拆到 cmd/proxy）。
  # GLM_API_KEY 经根 .env 注入（compose 插值）。
  runner:
    image: liusha/runner:1.0
    build:
      context: .
      dockerfile: cmd/runner/Dockerfile
    container_name: liusha-runner
    restart: unless-stopped
    environment:
      LIUSHA_POSTGRES_DSN: postgres://liusha:liusha@postgres:5432/liusha?sslmode=disable
      LIUSHA_REDIS_ADDR: redis:6379
      LIUSHA_CONFIG: /app/config/config.yaml
      LIUSHA_ENV: development
      LIUSHA_LOG_LEVEL: info
      # LLM provider api_key：使用 GLM
      GLM_API_KEY: "${GLM_API_KEY:-placeholder-key}"
      # LLM provider 密钥加密密钥：用于加密存储在数据库中的 API keys
      LIUSHA_LLM_KEY_SECRET: "${LIUSHA_LLM_KEY_SECRET:-changeme-dev-encryption-secret-must-be-32-chars}"
    volumes:
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  liusha-pg:
  liusha-redis:
  liusha-proxy-certs:
