# 生产形态 overlay：与 compose.yaml 叠加使用
#
# 用法：
#   make prod-up                                    # 维护者（本地构建）
#   docker compose -f compose.yaml -f compose.prod.yaml \
#       --profile full pull && \
#   docker compose -f compose.yaml -f compose.prod.yaml \
#       --profile full up -d                        # 用户（拉取镜像）
# （数据库迁移由 migrate 一次性服务随 up 自动执行，无需本地 Go 工具链）
#
# 与默认（dev）的差异：
#   - LIUSHA_ENV=production  → stdout 走 JSON 单行（不再彩色 console）
#   - LIUSHA_LOG_FORMAT=json → 显式锁死，避免被其它环境变量翻转
#   （LOG_FORMAT 故意与 ENV 一起显式写：生产锁死格式，不依赖 logx 的推导默认）

x-prod-env: &prod-env
  LIUSHA_ENV: production
  LIUSHA_LOG_FORMAT: json

services:
  api:
    environment: *prod-env

  proxy:
    environment: *prod-env

  runner:
    environment: *prod-env
